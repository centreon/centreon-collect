on:
  workflow_call:
    inputs:
      version_file:
        required: false
        type: string
        default: CMakeLists.txt
      nightly_manual_trigger:
        required: false
        type: boolean
      labels:
        required: false
        type: string
        default: ""
    outputs:
      latest_major_version:
        description: "latest major version"
        value: ${{ jobs.get-environment.outputs.latest_major_version }}
      previous_release_bundle_tag:
        description: "previous release bundle tag"
        value: ${{ jobs.get-environment.outputs.previous_release_bundle_tag }}
      is_cloud:
        description: "context of release (cloud or not cloud)"
        value: ${{ jobs.get-environment.outputs.is_cloud }}
      delivery_type:
        description: "context of delivery (feature branch or classic delivery)"
        value: ${{ jobs.get-environment.outputs.delivery_type }}
      linked_dev_branch:
        description: "linked develop branch"
        value: ${{ jobs.get-environment.outputs.linked_dev_branch }}
      linked_stable_branch:
        description: "linked stable branch"
        value: ${{ jobs.get-environment.outputs.linked_stable_branch }}
      major_version:
        description: "major version"
        value: ${{ jobs.get-environment.outputs.major_version }}
      minor_version:
        description: "minor version"
        value: ${{ jobs.get-environment.outputs.minor_version }}
      release:
        description: "release"
        value: ${{ jobs.get-environment.outputs.release }}
      cma_major_version:
        description: "cma major version"
        value: ${{ jobs.get-environment.outputs.cma_major_version }}
      cma_minor_version:
        description: "minor version"
        value: ${{ jobs.get-environment.outputs.cma_minor_version }}
      stability:
        description: "branch stability (stable, testing, unstable, canary)"
        value: ${{ jobs.get-environment.outputs.stability }}
      target_stability:
        description: "Final target branch stability (stable, testing, unstable, canary or not defined if not a pull request)"
        value: ${{ jobs.get-environment.outputs.target_stability }}
      release_type:
        description: "type of release (hotfix, release or not defined if not a release)"
        value: ${{ jobs.get-environment.outputs.release_type }}
      os_and_database_matrix:
        description: "matrix to use for dockerize and test jobs"
        value: ${{ jobs.get-environment.outputs.os_and_database_matrix }}
      collect_matrix:
        description: "matrix to use for collect jobs (deduplicated by os+arch)"
        value: ${{ jobs.get-environment.outputs.collect_matrix }}
      collect_robot_matrix:
        description: "matrix to use for collect jobs (contains arch)"
        value: ${{ jobs.get-environment.outputs.collect_robot_matrix }}
      cma_matrix:
        description: "matrix to use for cma jobs (contains arch)"
        value: ${{ jobs.get-environment.outputs.cma_matrix }}
      cma_robot_matrix:
        description: "matrix to use for cma jobs (contains arch)"
        value: ${{ jobs.get-environment.outputs.cma_robot_matrix }}
      is_targeting_feature_branch:
        description: "if it is a PR, check if targeting a feature branch"
        value: ${{ jobs.get-environment.outputs.is_targeting_feature_branch }}
      is_nightly:
        description: "if the current workflow run is considered a nightly"
        value: ${{ jobs.get-environment.outputs.is_nightly }}
      packaging_img_version:
        description: "docker image version for packaging (vcpkg checksum)"
        value: ${{ jobs.get-environment.outputs.packaging_img_version }}
      test_img_version:
        description: "test docker image version (checksum of database sql, script and dockerfiles)"
        value: ${{ jobs.get-environment.outputs.test_img_version }}
      skip_workflow:
        description: "if the current workflow should be skipped"
        value: ${{ jobs.get-environment.outputs.skip_workflow }}
      labels:
        description: "list of labels on the PR"
        value: ${{ jobs.get-environment.outputs.labels }}

jobs:
  get-environment:
    runs-on: ubuntu-24.04
    outputs:
      latest_major_version: ${{ steps.latest_major_version.outputs.latest_major_version }}
      previous_release_bundle_tag: ${{ steps.get_previous_release_bundle_tag.outputs.previous_release_bundle_tag }}
      is_cloud: ${{ steps.detect_cloud_version.outputs.isCloud }}
      delivery_type: ${{ steps.detect_delivery_type.outputs.delivery_type }}
      linked_dev_branch: ${{ steps.linked_branches.outputs.linked_dev_branch }}
      linked_stable_branch: ${{ steps.linked_branches.outputs.linked_stable_branch }}
      major_version: ${{ steps.get_version.outputs.major_version }}
      minor_version: ${{ steps.get_version.outputs.minor_version }}
      release: ${{ steps.get_release.outputs.release }}
      cma_major_version: ${{ steps.get_version.outputs.cma_major_version }}
      cma_minor_version: ${{ steps.get_version.outputs.cma_minor_version }}
      stability: ${{ steps.get_stability.outputs.stability }}
      target_stability: ${{ steps.get_stability.outputs.target_stability }}
      release_type: ${{ steps.get_release_type.outputs.release_type }}
      os_and_database_matrix: ${{ steps.get_os_database_matrix.outputs.result }}
      collect_matrix: ${{ steps.get_os_database_matrix.outputs.collect_matrix }}
      collect_robot_matrix: ${{ steps.get_os_database_matrix.outputs.collect_robot_matrix }}
      cma_matrix: ${{ steps.get_os_database_matrix.outputs.cma_matrix }}
      cma_robot_matrix: ${{ steps.get_os_database_matrix.outputs.cma_robot_matrix }}
      is_targeting_feature_branch: ${{ steps.get_stability.outputs.is_targeting_feature_branch }}
      is_nightly: ${{ steps.get_nightly_status.outputs.is_nightly }}
      packaging_img_version: ${{ steps.get_docker_images_version.outputs.packaging_img_version }}
      test_img_version: ${{ steps.get_docker_images_version.outputs.test_img_version }}
      skip_workflow: ${{ steps.skip_workflow.outputs.result }}
      labels: ${{ steps.has_skip_label.outputs.labels }}

    steps:
      - name: Check if PR has skip label
        id: has_skip_label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          IS_PR: ${{ contains(fromJSON('["pull_request"]') , github.event_name) }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LABELS: ${{ inputs.labels }}
        with:
          script: |
            let hasSkipLabel = false;
            let labels = [];

            const skipLabel = `skip-workflow-${process.env.WORKFLOW_NAME}`;

            if (process.env.IS_PR === 'true') {
              try {
                const fetchedLabels = await github.rest.issues.listLabelsOnIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number
                });
                fetchedLabels.data.forEach(({ name }) => {
                  labels.push(name);
                  if (name === skipLabel) {
                    hasSkipLabel = true;
                  }
                });
              } catch (e) {
                core.warning(`failed to list labels: ${e}`);
              }
            } else if (process.env.EVENT_NAME === 'workflow_dispatch' && process.env.INPUT_LABELS.length > 0) {
              labels = process.env.INPUT_LABELS
                .split(',')
                .map(label => label.trim())
                .filter(label => label.length > 0);
            }

            core.setOutput('labels', labels);

            return hasSkipLabel;

      - name: Checkout sources (current branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ steps.has_skip_label.outputs.result == 'true' && 100 || 1 }}

      # get latest major version to detect cloud / on-prem versions
      - name: Checkout sources (develop branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          path: centreon-develop
          sparse-checkout: .version

      - if: ${{ steps.has_skip_label.outputs.result == 'true' }}
        name: Get workflow triggered paths
        id: get_workflow_triggered_paths
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_REPOSITORY: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');

            let paths = [];

            const workflowFilePath = process.env.WORKFLOW_REF.replace(`${process.env.GH_REPOSITORY}/`, '').split('@').shift();

            if (fs.existsSync(workflowFilePath)) {
              const workflowFileContent = fs.readFileSync(workflowFilePath, 'utf8');
              const workflowFileContentLines = workflowFileContent.split('\n');

              let hasReadOn = false;
              let hasReadPullRequest = false;
              let hasReadPaths = false;
              for (const line of workflowFileContentLines) {
                if (line.match(/^on:\s*$/)) {
                  hasReadOn = true;
                  continue;
                }
                if (line.match(/^\s{2}pull_request(_target)?:\s*$/)) {
                  hasReadPullRequest = true;
                  continue;
                }
                if (line.match(/^\s{4}paths:\s*$/)) {
                  hasReadPaths = true;
                  continue;
                }

                if (hasReadOn && hasReadPullRequest && hasReadPaths) {
                  const matches = line.match(/^\s{6}-\s['"]?(.+?)['"]?\s*$/);
                  if (matches) {
                    paths.push(matches[1].trim());
                  } else {
                    break;
                  }
                }
              }
            }

            if (paths.length === 0) {
              paths = ['**'];
            }

            console.log(paths);

            return paths;

      - if: ${{ steps.has_skip_label.outputs.result == 'true' }}
        name: Get push changes
        id: get_push_changes
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          since_last_remote_commit: true
          json: true
          escape_json: false
          files: ${{ join(fromJSON(steps.get_workflow_triggered_paths.outputs.result), ';') }}
          files_separator: ";"

      - name: Check if current workflow should be skipped
        id: skip_workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GH_REF: ${{ github.head_ref || github.ref_name }}
          HAS_SKIP_LABEL: ${{ steps.has_skip_label.outputs.result }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ANY_CHANGED: ${{ steps.get_push_changes.outputs.any_changed }}
        with:
          script: |
            if (/^bump-.+/.test(process.env.GH_REF)) {
              core.notice('skipping workflow because it is a bump branch');
              return true;
            }

            if (process.env.HAS_SKIP_LABEL === 'false') {
              return false;
            }

            const label = `skip-workflow-${process.env.WORKFLOW_NAME}`;
            if (process.env.ANY_CHANGED === 'true') {
              try {
                await github.rest.issues.removeLabel({
                  name: label,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number
                });
                core.notice(`label ${label} removed because changes were detected on last push.`);
              } catch (e) {
                core.warning(`failed to remove label ${label}: ${e}`);
              }

              return false;
            }

            return true;

      - name: Store latest major version
        id: latest_major_version
        run: |
          . centreon-develop/.version
          echo "latest_major_version=$MAJOR" >> $GITHUB_OUTPUT
        shell: bash

      - if: ${{ github.event_name == 'pull_request' }}
        name: Get nested pull request path
        id: pr_path
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_BASE_REF: ${{ github.base_ref }}
        with:
          script: |
            const prPath = [process.env.GH_HEAD_REF, process.env.GH_BASE_REF];

            const result = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              state: 'open'
            });

            let found = true;
            while (found) {
              found = false;
              result.data.forEach(({ head: { ref: headRef }, base: { ref: baseRef} }) => {
                if (headRef === prPath[prPath.length - 1] && ! prPath.includes(baseRef)) {
                  found = true;
                  prPath.push(baseRef);
                }
              });
            }

            return prPath;

      - name: Get stability
        id: get_stability
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          IS_PR: ${{ contains(fromJSON('["pull_request"]') , github.event_name) }}
          PR_PATH: ${{ steps.pr_path.outputs.result || '[]' }}
        with:
          script: |
            const ref = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;
            const refType = process.env.GITHUB_REF_TYPE; // 'branch' or 'tag'
            const eventName = process.env.GITHUB_EVENT_NAME;

            console.log(`Ref: ${ref}`);
            console.log(`Ref Type: ${refType}`);
            console.log(`Event Name: ${eventName}`);

            const getStability = (ref) => {
              const refName = ref.replace(/^refs\/(heads|tags)\//, '');
              console.log(`Determining stability for refName: ${refName}`);

              switch (true) {
                case /(^develop$)|(^dev-\d{2}\.\d{2}\.x$)|(^prepare-release-cloud.*)/.test(refName):
                  console.log(`Matched 'unstable' pattern`);
                  return 'unstable';
                case /(^release.+)|(^hotfix.+)/.test(refName):
                  console.log(`Matched 'testing' pattern`);
                  return 'testing';
                case /(^master$)|(^\d{2}\.\d{2}\.x$)/.test(refName):
                  console.log(`Matched 'stable' pattern`);
                  return 'stable';
                default:
                  console.log(`No match found, defaulting to 'canary'`);
                  return 'canary';
              }
            };

            // Handle tags like centreon-web-XX.YY.z or centreon-pp-manager-XX.YY.z FIRST
            // to allow promote for centreon packages (centreon-web, etc)
            // Handle tags like release-cloud-YYYYMMNN-XX.YY or release-onprem-YYYYMMNN-XX.YY SECOND
            // to allow promote for extra packages (lua-curl, libzmq, etc)
            const isStableTag = (tag) => {
              const matched =
                /^centreon-[a-z0-9-]+-\d{2}\.\d{2}\.\d+$/.test(tag) ||
                /^release-(cloud|onprem)-\d{8}-\d{2}\.\d{2}$/.test(tag);
              console.log(`Checking if tag '${tag}' matches stable tag pattern: ${matched}`);
              return matched;
            };

            let stability;
            if (eventName === 'push' && refType === 'tag') {
              console.log(`Push event on a tag detected.`);
              stability = isStableTag(ref) ? 'stable' : getStability(ref);
            } else {
              stability = getStability(ref);
            }

            console.log(`Final stability: ${stability}`);
            core.setOutput('stability', stability);

            let isTargetingFeatureBranch = false;

            if (process.env.IS_PR === 'true') {
              console.log(`Evaluating pull request target path for feature branch detection`);
              let targetStability = 'canary';
              const prPath = JSON.parse(process.env.PR_PATH);
              prPath.shift(); // remove current branch

              if (prPath.length && getStability(prPath[0]) === 'canary') {
                console.log(`First target branch is canary — flagging as targeting feature branch`);
                isTargetingFeatureBranch = true;
              }

              prPath.every((branchName) => {
                console.log(`checking stability of ${branchName}`)
                targetStability = getStability(branchName);

                if (targetStability !== 'canary') {
                  console.log(`Found a non-canary target: ${branchName}, stop checking`);
                  return false;
                }

                return true;
              });

              console.log(`Final target stability: ${targetStability}`);
              core.setOutput('target_stability', targetStability);
            }

            core.setOutput('is_targeting_feature_branch', isTargetingFeatureBranch);

      - name: Get version from ${{ inputs.version_file }}
        id: get_version
        env:
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          if [[ "$VERSION_FILE" == *.version* ]]; then
            . .version
            . "$VERSION_FILE"
            VERSION="$MAJOR.$MINOR"
          elif [[ "$VERSION_FILE" == CMakeLists.txt ]]; then
            MAJOR=$(awk '$1 ~ "COLLECT_MAJOR" {maj=substr($2, 1, length($2)-1)} $1 ~ "COLLECT_MINOR" {min=substr($2, 1, length($2)-1) ; print maj "." min}' CMakeLists.txt)
            MINOR=$(awk '$1 ~ "COLLECT_PATCH" {print substr($2, 1, length($2) - 1)}' CMakeLists.txt)
            VERSION="$MAJOR.$MINOR"
            CMA_MAJOR=$(awk '$1 ~ "COLLECT_MAJOR" {maj=substr($2, 1, length($2)-1)} $1 ~ "COLLECT_MINOR" {min=substr($2, 1, length($2)-1) ; print maj "." min}' CMakeLists.txt)
            CMA_MINOR=$(awk '$1 ~ "AGENT_PATCH" {print substr($2, 1, length($2) - 1)}' CMakeLists.txt)
            CMA_VERSION="$CMA_MAJOR.$CMA_MINOR"
          else
            echo "Unable to parse version file $VERSION_FILE"
            exit 1
          fi

          if grep -E '^[2-9][0-9]\.[0-9][0-9]\.[0-9]+' <<<"$VERSION" >/dev/null 2>&1 ; then
            n=${VERSION//[!0-9]/ }
            a=(${n//\./ })
            echo "major_version=${a[0]}.${a[1]}" >> $GITHUB_OUTPUT
            MAJOR=${a[0]}.${a[1]}
            echo "minor_version=${a[2]}" >> $GITHUB_OUTPUT
          else
            echo "Cannot parse version number from $VERSION_FILE"
            exit 1
          fi

          if [[ "$VERSION_FILE" == CMakeLists.txt ]]; then
            if grep -E '^[2-9][0-9]\.[0-9][0-9]\.[0-9]+' <<<"$CMA_VERSION" >/dev/null 2>&1 ; then
              n=${CMA_VERSION//[!0-9]/ }
              a=(${n//\./ })
              echo "cma_major_version=${a[0]}.${a[1]}" >> $GITHUB_OUTPUT
              MAJOR=${a[0]}.${a[1]}
              echo "cma_minor_version=${a[2]}" >> $GITHUB_OUTPUT
            else
              echo "Cannot parse version number from $VERSION_FILE"
              exit 1
            fi
          else
            echo "cma_major_version=0.0" >> $GITHUB_OUTPUT
            echo "cma_minor_version=0" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: "Get release: 1 for testing / stable, <date>.<commit_sha> for others"
        id: get_release
        env:
          STABILITY: ${{ steps.get_stability.outputs.stability }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ "$STABILITY" == "testing" || "$STABILITY" == "stable" ]]; then
            RELEASE="1"
          else
            RELEASE="$(date +%s).$(echo "$GH_SHA" | cut -c -7)"
          fi

          echo "release=$RELEASE" >> $GITHUB_OUTPUT
        shell: bash

      - name: "Get release type: hotfix, release or not defined if not a release"
        id: get_release_type
        env:
          GH_REF: ${{ github.head_ref || github.ref_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
        run: |
          # Set REF_NAME (branch or tag)
          REF_NAME="$GH_REF"

          # Get ref type (branch or tag)
          REF_TYPE="$GH_REF_TYPE"  # 'branch' or 'tag'
          RELEASE_TYPE=""

          # Get release type based on ref type
          # if ref_type is a branch => use prefix of branch name
          # if ref_type is a tag => use comment associated to the tag
          if [[ "$REF_TYPE" == "branch" ]]; then
            BASE=$(echo "$REF_NAME" | cut -d '-' -f 1)
            if [[ "$BASE" == "hotfix" || "$BASE" == "release" ]]; then
              RELEASE_TYPE="$BASE"
            fi
          elif [[ "$REF_TYPE" == "tag" ]]; then
            # Get tag message (requires fetch of tags and history for annotated tags)
            git fetch --tags --force
            TAG_MSG=$(git for-each-ref refs/tags/"$REF_NAME" --format='%(contents)')
            if echo "$TAG_MSG" | grep -q -i 'hotfix'; then
              RELEASE_TYPE="hotfix"
            elif echo "$TAG_MSG" | grep -q -i 'release'; then
              RELEASE_TYPE="release"
            fi
          fi

          if [[ -n "$RELEASE_TYPE" ]]; then
            echo "ref_type is: $REF_TYPE"
            echo "release_type is: $RELEASE_TYPE"
            echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Detect nightly status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: get_nightly_status
        env:
          NIGHTLY_MANUAL_TRIGGER: ${{ inputs.nightly_manual_trigger }}
          GH_REPOSITORY: ${{ github.repository }}
        with:
          script: |
            const getNightlyInput = () => {
              const nightly_manual_trigger = process.env.NIGHTLY_MANUAL_TRIGGER;
              console.log(nightly_manual_trigger);
              if (typeof nightly_manual_trigger === 'undefined' || nightly_manual_trigger === '' || process.env.GH_REPOSITORY.match(/^workflow-.*$/)) {
                return 'false';
              } else if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch' && nightly_manual_trigger === 'true' ) {
                return 'true';
              }
              return 'false';
            };

            core.setOutput('is_nightly', getNightlyInput());

      - name: "Detect cloud version"
        id: detect_cloud_version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          IS_NIGHTLY: ${{ steps.get_nightly_status.outputs.is_nightly }}
          DEVELOP_MAJOR_VERSION: ${{ steps.latest_major_version.outputs.latest_major_version }}
          CURRENT_MAJOR_VERSION: ${{ steps.get_version.outputs.major_version }}
          EVENT_NAME: ${{ github.event_name }}
          PR_PATH: ${{ steps.pr_path.outputs.result || '[]' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventName = process.env.GITHUB_EVENT_NAME;
            const ref = process.env.GITHUB_REF;         // full ref like refs/heads/develop or refs/tags/...
            const refName = process.env.GITHUB_REF_NAME; // just the branch/tag name
            const baseRef = process.env.GITHUB_BASE_REF; // only set for pull_request
            const isNightly = process.env.IS_NIGHTLY;

            const developMajorVersion = process.env.DEVELOP_MAJOR_VERSION;
            const currentMajorVersion = process.env.CURRENT_MAJOR_VERSION;
            // if major version is higher than develop major version => it is a cloud version
            // if month number is not 10 => it is a cloud version
            // anything else => onprem
            const isCloudCandidate =
              Number(currentMajorVersion) >= Number(developMajorVersion) ||
              !currentMajorVersion.match(/\.10$/);

            let releaseScope = "unknown";

            // in a nightly context, whatever the event_name is, the release context does not matter
            if ( process.env.IS_NIGHTLY == 'true' ) {
              releaseScope = isCloudCandidate ? "cloud" : "onprem";
            } else if ( process.env.EVENT_NAME === "pull_request" ) {
              // handle if triggering event is a pull_request
              // finalTargetBranch can be develop, dev-XX.YY.x, release-XX.YY-next, hotfix-XX.YY-next
              const prPath = JSON.parse(process.env.PR_PATH);
              const finalTargetBranch = prPath.pop();
              console.log(`finalTargetBranch is: ${finalTargetBranch}`)

              // if finalTarget branch is develop => it is a cloud version
              if (['develop'].includes(finalTargetBranch)) {
                releaseScope = "cloud";
              } else {
                releaseScope = isCloudCandidate ? "cloud" : "onprem";
              }
            }
            // handle if triggering event is a push_tag of a release
            else if (eventName === "push" && ref.startsWith("refs/tags/")) {
              console.log(`🏷️ Tag pushed: ${refName}`);
              // Extract scope (cloud on onprem) from tag description
              // Format expected: "release-cloud-20270800-27.08 or release-onprem-20270800-24.10"

              // get release bundle
              // Get the commit SHA that this tag points to
              const tagRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${refName}`
              });

              let targetSha = tagRef.data.object.sha;

              // Resolve to commit SHA (if annotated tag)
              if (tagRef.data.object.type === "tag") {
                const tagObj = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: targetSha,
                });
                targetSha = tagObj.data.object.sha;
              }
              console.log(`📌 Commit SHA from tag: ${targetSha}`);

              const releaseTags = await github.paginate(
                github.rest.git.listMatchingRefs,
                {
                  owner,
                  repo,
                  ref: "tags/release-",
                }
              );
              console.log(`🔍 Found ${releaseTags.length} release-* tags`);

              let matchingTag = null;

              // Find all refs/tags and filter to find the matching release-* tags
              const tags = await github.paginate(github.rest.git.listMatchingRefs, {
                owner,
                repo,
                ref: "tags/"
              });

              for (const tag of releaseTags) {
                let tagSha = tag.object.sha;
                if (tag.object.type === "tag") {
                  const tagObj = await github.rest.git.getTag({
                    owner,
                    repo,
                    tag_sha: tagSha,
                  });
                  tagSha = tagObj.data.object.sha;
                }

                console.log(`🧷 Tag ${tag.ref} -> commit SHA: ${tagSha}`);

                if (tagSha === targetSha) {
                  matchingTag = tag.ref;
                  break;
                }
              }

              if (!matchingTag) {
                core.setFailed(`❌ No matching release-* tag found on commit: ${targetSha}`);
                return;
              }

              const bundleTag = matchingTag.replace("refs/tags/", "");
              const scope = bundleTag.split("-")[1];

              if (!["cloud", "onprem"].includes(scope)) {
                core.setFailed(`❌ Unknown scope in bundle tag: ${bundleTag}`);
                return;
              }

              releaseScope = scope;
            }
            // handle if triggering event is a push
            else if (ref.startsWith("refs/heads/") && (eventName === "push" || eventName === "workflow_dispatch")) {
              const branch = ref.replace("refs/heads/", "");
              console.log(`🚀 ${eventName} on branch: ${branch}`);

              releaseScope = isCloudCandidate ? "cloud" : "onprem";
            }
            // in any other case, fail the run
            else {
              core.setFailed(`❌ Unsupported event: ${eventName}`);
              return;
            }

            // Set isCloud if releaseScope value is "cloud"
            const isCloud = releaseScope === "cloud";

            console.log(`📦 releaseScope: ${releaseScope}`);
            core.setOutput("releaseScope", releaseScope);
            core.setOutput("isCloud", isCloud);

      - name: "Detect delivery type"
        id: detect_delivery_type
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HAS_DELIVERY_FEATURE_LABEL: ${{ contains(steps.has_skip_label.outputs.labels, 'delivery-feature') }}
        with:
          script: |
            let delivery_type  = 'classic';
            if (process.env.HAS_DELIVERY_FEATURE_LABEL === 'true') {
              delivery_type = 'feature';
            }

            core.setOutput('delivery_type', delivery_type);

      - name: Detect linked dev and stable branches
        id: linked_branches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          IS_CLOUD: ${{ steps.detect_cloud_version.outputs.isCloud }}
          MAJOR_VERSION: ${{ steps.get_version.outputs.major_version }}
        with:
          script: |
            let linkedDevBranch = 'develop';
            let linkedStableBranch = 'master';
            if (process.env.IS_CLOUD === 'false') {
              linkedDevBranch = `dev-${process.env.MAJOR_VERSION}.x`;
              linkedStableBranch = `${process.env.MAJOR_VERSION}.x`;
            }
            core.setOutput('linked_dev_branch', linkedDevBranch);
            core.setOutput('linked_stable_branch', linkedStableBranch);

      - name: Get previous release bundle tag
        id: get_previous_release_bundle_tag
        env:
          IS_CLOUD: ${{ steps.detect_cloud_version.outputs.isCloud }}
          STABILITY: ${{ steps.get_stability.outputs.stability }}
          MAJOR_VERSION: ${{ steps.get_version.outputs.major_version }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            if (process.env.STABILITY !== 'testing' && process.env.STABILITY !== 'stable') {
              core.setOutput('previous_release_bundle_tag', '');
              return;
            }

            let execOutput = '';
            let execError = '';
            const execOptions = {
              listeners: {
                stdout: (data) => {
                  execOutput += data.toString();
                },
                stderr: (data) => {
                  execError += data.toString();
                }
              },
              silent: true
            };

            let previousStableBundleSha = '';
            let previousStableBundleTag = '';

            await exec.exec(
              `bash -c "git ls-remote --tags origin 'refs/tags/release-${process.env.IS_CLOUD === 'true' && 'cloud' || 'onprem'}-*' | grep -v '{}' | sort -t'-' -k4r,4 -k3r,3"`,
              [],
              execOptions
            );

            for (const line of execOutput.split('\n')) {
              const tag = line.trim();
              const matches = tag.match(/^(.+)\s+.+\/(release-(cloud|onprem)-\d{8}-(\d{2}\.\d{2}))$/);
              if (matches && Number(matches[4]) <= Number(process.env.MAJOR_VERSION)) {
                previousStableBundleSha = matches[1];
                previousStableBundleTag = matches[2];
                break;
              } else {
                console.log(`Ignoring non-matching tag: ${tag}`);
              }
            }

            console.log(`Previous release bundle tag is: ${previousStableBundleTag} (${previousStableBundleSha})`);

            core.setOutput('previous_release_bundle_tag', previousStableBundleTag);

      - name: Detect operating systems and databases to test
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: get_os_database_matrix
        env:
          IS_CLOUD: ${{ steps.detect_cloud_version.outputs.isCloud }}
          IS_NIGHTLY: ${{ steps.get_nightly_status.outputs.is_nightly }}
          STABILITY: ${{ steps.get_stability.outputs.stability }}
          HAS_DATABASE_LABEL: ${{ contains(steps.has_skip_label.outputs.labels, 'database') }}
          HAS_SYSTEM_LABEL: ${{ contains(steps.has_skip_label.outputs.labels, 'system') }}
        with:
          script: |
            // --- Conditions (evaluated once from GHA context) ---
            const isCloud     = process.env.IS_CLOUD === 'true';
            const isNightly   = process.env.IS_NIGHTLY === 'true';
            const stability   = process.env.STABILITY;
            const hasDbLabel  = process.env.HAS_DATABASE_LABEL === 'true';
            const hasSysLabel = process.env.HAS_SYSTEM_LABEL === 'true';
            const isFullRun   = hasDbLabel
                             || hasSysLabel
                             || ['unstable', 'testing', 'stable'].includes(stability);
            const isSystemRun = hasSysLabel
                             || ['unstable', 'testing', 'stable'].includes(stability);
            const isDbRun     = hasDbLabel
                             || ['unstable', 'testing', 'stable'].includes(stability);

            // --- OS/database combinations ---
            const cfg = (operating_system, database) => ({ operating_system, database, arch: 'amd64' });

            const alma10_mysql_8_4       = cfg('alma10',   'mysql:8.4');
            const alma10_mariadb_10_11   = cfg('alma10',   'mariadb:10.11');
            const alma9_mysql_8_0        = cfg('alma9',    'mysql:8.0');
            const alma8_mariadb_10_11    = cfg('alma8',    'mariadb:10.11');
            const bullseye_mariadb_10_11 = cfg('bullseye', 'mariadb:10.11');
            const bookworm_mariadb_10_11 = cfg('bookworm', 'mariadb:10.11');
            const trixie_mariadb_11_8    = cfg('trixie',   'mariadb:11.8');
            const trixie_mysql_8_4       = cfg('trixie',   'mysql:8.4');
            const jammy_mariadb_10_11    = cfg('jammy',    'mariadb:10.11');
            const noble_mariadb_10_11    = cfg('noble',    'mariadb:10.11');

            // --- Config sets ---
            const configs = [alma9_mysql_8_0, alma10_mariadb_10_11, trixie_mariadb_11_8];
            const cmaConfigs = [
              alma10_mariadb_10_11, alma9_mysql_8_0, alma8_mariadb_10_11,
              bullseye_mariadb_10_11, bookworm_mariadb_10_11, trixie_mariadb_11_8,
              jammy_mariadb_10_11, noble_mariadb_10_11
            ];
            const cloud = alma9_mysql_8_0;

            // --- Nightly rotation (cycles through configs on working days) ---
            const getDailyConfig = (configs) => {
              const today = new Date();
              const dayOfWeek = today.getDay();
              if (dayOfWeek === 0 || dayOfWeek === 6) return configs[0]; // weekend → default
              let workingDays = 0;
              const d = new Date('2025-01-01');
              while (d < today) {
                if (d.getDay() >= 1 && d.getDay() <= 5) workingDays++;
                d.setDate(d.getDate() + 1);
              }
              return configs[workingDays % configs.length];
            };

            // --- Build base matrix ---
            const main = isCloud ? cloud : alma10_mariadb_10_11;
            const activeConfig = isNightly ? getDailyConfig(configs) : main;

            let matrix = { cloud: [cloud], main: [activeConfig], operating_systems: [activeConfig] };
            let collectMatrix = [activeConfig];
            let cmaMatrix = [activeConfig];

            if (isFullRun) {
              const uniqueOsConfigs = [...new Map(configs.map(c => [`${c.operating_system}-${c.arch}`, c])).values()];
              matrix = { ...matrix, operating_systems: uniqueOsConfigs };
              collectMatrix = configs;
              cmaMatrix = isCloud
                ? cmaConfigs.filter(c => c.operating_system !== 'bullseye')
                : cmaConfigs;
            }

            console.log('matrix', matrix);

            // --- Expand arm64 for Debian-based distros ---
            const ARM64_DISTROS = ['bullseye', 'bookworm', 'trixie', 'jammy', 'noble'];
            const withArch = (configs) => configs.flatMap(c =>
              ARM64_DISTROS.includes(c.operating_system)
                ? [{...c, arch: 'amd64'}, {...c, arch: 'arm64'}]
                : [{...c, arch: 'amd64'}]
            );

            if (isSystemRun) {
              collectMatrix = withArch(collectMatrix);
              cmaMatrix = withArch(cmaMatrix);
            }

            // deduplicate by os+arch (no database dimension needed for build/packaging)
            collectMatrix = [...new Map(collectMatrix.map(c => [`${c.operating_system}-${c.arch}`, c])).values()];

            core.setOutput('collect_matrix', collectMatrix);
            console.log('collectMatrix', collectMatrix);

            core.setOutput('cma_matrix', cmaMatrix);
            console.log('cmaMatrix', cmaMatrix);

            // --- Robot test matrices ---
            const setTestConfigs = (configs) => {
              let hasGrpcConfig = false;
              let hasMysqlConfig = false;
              return configs.flatMap(c => {
                const entries = [{...c, database_type: 'mariadb', tests_params: '{}'}];
                if (c.arch === 'amd64' && !hasGrpcConfig) {
                  entries.push({...c, database_type: 'mariadb', tests_params: '{"default_transport":"grpc","default_bbdo_version":"3.1.0"}'});
                  hasGrpcConfig = true;
                }
                if (['alma8', 'alma9'].includes(c.operating_system) && !hasMysqlConfig && c.arch === 'amd64' && isDbRun) {
                  entries.push({...c, database_type: 'mysql', tests_params: '{}'});
                  hasMysqlConfig = true;
                }
                return entries;
              });
            };

            // No grpc, no mysql for CMA robot tests
            const setCmaTestConfigs = (configs) => configs.map(c => ({...c, database_type: 'mariadb', tests_params: '{}'}));

            const collectRobotMatrix = setTestConfigs(collectMatrix);
            core.setOutput('collect_robot_matrix', collectRobotMatrix);
            console.log('collectRobotMatrix', collectRobotMatrix);

            const cmaRobotMatrix = setCmaTestConfigs(cmaMatrix);
            core.setOutput('cma_robot_matrix', cmaRobotMatrix);
            console.log('cmaRobotMatrix', cmaRobotMatrix);

            return matrix;

      - name: Get docker images version
        id: get_docker_images_version
        run: |
          PACKAGING_IMG_VERSION=$(cat `ls .github/docker/Dockerfile.packaging-*` vcpkg.json | md5sum | awk '{print substr($1, 0, 8)}')
          echo "packaging_img_version=$PACKAGING_IMG_VERSION" >> $GITHUB_OUTPUT

          TEST_IMG_VERSION=$(cat .github/docker/Dockerfile.centreon-collect-*-test .github/scripts/collect-prepare-test-robot.sh resources/*.sql | md5sum | cut -c1-8)
          echo "test_img_version=$TEST_IMG_VERSION" >> $GITHUB_OUTPUT

      - name: Display info in job summary
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          LATEST_MAJOR_VERSION: ${{ steps.latest_major_version.outputs.latest_major_version }}
          IS_CLOUD: ${{ steps.detect_cloud_version.outputs.isCloud }}
          PREVIOUS_RELEASE_BUNDLE_TAG: ${{ steps.get_previous_release_bundle_tag.outputs.previous_release_bundle_tag }}
          DELIVERY_TYPE: ${{ steps.detect_delivery_type.outputs.delivery_type }}
          LINKED_DEV_BRANCH: ${{ steps.linked_branches.outputs.linked_dev_branch }}
          LINKED_STABLE_BRANCH: ${{ steps.linked_branches.outputs.linked_stable_branch }}
          MAJOR_VERSION: ${{ steps.get_version.outputs.major_version }}
          MINOR_VERSION: ${{ steps.get_version.outputs.minor_version }}
          RELEASE: ${{ steps.get_release.outputs.release }}
          CMA_MAJOR_VERSION: ${{ steps.get_version.outputs.cma_major_version }}
          CMA_MINOR_VERSION: ${{ steps.get_version.outputs.cma_minor_version }}
          STABILITY: ${{ steps.get_stability.outputs.stability }}
          RELEASE_TYPE: ${{ steps.get_release_type.outputs.release_type }}
          IS_TARGETING_FEATURE_BRANCH: ${{ steps.get_stability.outputs.is_targeting_feature_branch }}
          IS_NIGHTLY: ${{ steps.get_nightly_status.outputs.is_nightly }}
          PACKAGING_IMG_VERSION: ${{ steps.get_docker_images_version.outputs.packaging_img_version }}
          TEST_IMG_VERSION: ${{ steps.get_docker_images_version.outputs.test_img_version }}
          SKIP_WORKFLOW: ${{ steps.skip_workflow.outputs.result }}
          LABELS: ${{ steps.has_skip_label.outputs.labels }}
          TARGET_STABILITY: ${{ steps.get_stability.outputs.target_stability }}
          EVENT_NAME: ${{ github.event_name }}
          PR_PATH: ${{ steps.pr_path.outputs.result || '[]' }}
        with:
          script: |
            const outputTable = [
              [{data: 'Name', header: true}, {data: 'Value', header: true}],
              ['latest_major_version', process.env.LATEST_MAJOR_VERSION],
              ['is_cloud', process.env.IS_CLOUD],
              ['previous_release_bundle_tag', process.env.PREVIOUS_RELEASE_BUNDLE_TAG || '<em>not found</em>'],
              ['delivery_type', process.env.DELIVERY_TYPE],
              ['linked_dev_branch', process.env.LINKED_DEV_BRANCH],
              ['linked_stable_branch', process.env.LINKED_STABLE_BRANCH],
              ['major_version', process.env.MAJOR_VERSION],
              ['minor_version', process.env.MINOR_VERSION],
              ['release', process.env.RELEASE],
              ['cma_major_version', process.env.CMA_MAJOR_VERSION],
              ['cma_minor_version', process.env.CMA_MINOR_VERSION],
              ['stability', process.env.STABILITY],
              ['release_type', process.env.RELEASE_TYPE || '<em>not defined because this is not a release</em>'],
              ['is_targeting_feature_branch', process.env.IS_TARGETING_FEATURE_BRANCH],
              ['is_nightly', process.env.IS_NIGHTLY],
              ['packaging_img_version', process.env.PACKAGING_IMG_VERSION],
              ['test_img_version', process.env.TEST_IMG_VERSION],
              ['skip_workflow', process.env.SKIP_WORKFLOW],
              ['labels', process.env.LABELS],
            ];

            outputTable.push(['target_stability', process.env.TARGET_STABILITY || '<em>not defined because current run is not triggered by pull request event</em>']);

            core.summary
              .addHeading(`${context.workflow} environment outputs`)
              .addTable(outputTable);

            if (process.env.EVENT_NAME === "pull_request") {
              const prPath = JSON.parse(process.env.PR_PATH);
              const mainBranchName = prPath.pop();
              let codeBlock = `
                %%{ init: { 'gitGraph': { 'mainBranchName': '${mainBranchName}', 'showCommitLabel': false } } }%%
                gitGraph
                  commit`;
              prPath.reverse().forEach((branchName) => {
                codeBlock = `${codeBlock}
                  branch ${branchName}
                  checkout ${branchName}
                  commit`;
              });

              core.summary
                .addHeading('Git workflow')
                .addCodeBlock(
                  codeBlock,
                  "mermaid"
                );
            }

            core.summary.write();
