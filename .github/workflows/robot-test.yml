on:
  workflow_call:
    inputs:
      distrib:
        required: true
        type: string
      arch:
        required: true
        type: string
      test_img_version:
        required: true
        type: string
      database_type:
        required: true
        type: string
      tests_params:
        required: true
        type: string
      is_nightly:
        required: false
        type: string
      features_pattern:
        required: false
        type: string
        default: .robot
      aws_role_arn:
        required: true
        type: string
      aws_web_identity_token_file:
        required: true
        type: string
      store_docker_image_in_cache:
        required: false
        type: boolean
        default: true
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true
      xray_client_id:
        required: true
      xray_client_secret:
        required: true
      jira_base_url:
        required: true
      jira_user_email:
        required: true
      jira_api_token:
        required: true

jobs:
  test-image-to-cache:
    if: ${{ inputs.store_docker_image_in_cache == true }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      IMAGE_NAME: centreon-collect-${{ inputs.database_type }}-${{ inputs.distrib }}${{ inputs.arch == 'arm64' && '-arm64' || '' }}-test
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Login to Proxy Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.DOCKER_PROXY_REGISTRY_URL }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: load and save image to disk
        run: |
          docker pull ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.test_img_version }}
          docker save -o ./${{ env.IMAGE_NAME }} ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.test_img_version }}
        shell: bash

      - name: image to cache
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ./${{ env.IMAGE_NAME }}
          key: ${{ env.IMAGE_NAME }}:${{ inputs.test_img_version }}

  robot-test-list:
    runs-on: ubuntu-24.04
    outputs:
      test_group_name: robot_test-${{ inputs.distrib }}-${{ inputs.database_type }}-${{ inputs.arch }}${{ contains(inputs.tests_params, 'grpc') && '-grpc' || '' }}
      features: ${{ steps.list-features.outputs.features }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: List features
        id: list-features
        run: |
          cd tests

          #when tests are executed by github cron, inputs are empty as centreon-collect.yml input default value is not used
          FEATURES_PATTERN="${{ inputs.features_pattern }}"
          if [ "0" = "0${FEATURES_PATTERN}" ]; then
            FEATURES_PATTERN='^((?!cma).)*$'
          fi

          features=$(grep -Rl '*** Test Cases ***' . | grep -P '.robot$' | grep -P "${FEATURES_PATTERN}" | sed -e "s#^./##" | sort | jq -R -s -c 'split("\n")[:-1]')
          if [[ "${{ inputs.database_type }}" == "mysql" ]]; then
            for feature in $(echo "${features}" | jq -r '.[]'); do
              if [[ ! -f "$feature.mysql" ]]; then
                features=$(echo "${features}" | jq -c "del(.[index(\"$feature\")])")
              fi
            done
          fi

          echo $features
          echo "features=${features}" >> $GITHUB_OUTPUT

  robot-test:
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'cancelled')
    needs: [robot-test-list, test-image-to-cache]
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.robot-test-list.outputs.features) }}

    name: ${{ matrix.feature }}

    env:
      IMAGE_NAME: centreon-collect-${{ inputs.database_type }}-${{ inputs.distrib }}${{ inputs.arch == 'arm64' && '-arm64' || '' }}-test

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Parse distrib name
        id: parse-distrib
        uses: ./.github/actions/parse-distrib
        with:
          distrib: ${{ inputs.distrib }}

      - name: Restore image
        id: restore-image
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ./${{ env.IMAGE_NAME }}
          key: ${{ env.IMAGE_NAME }}:${{ inputs.test_img_version }}
          fail-on-cache-miss: ${{ inputs.store_docker_image_in_cache == true }}

      - name: Restore packages
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ./*.${{ steps.parse-distrib.outputs.package_extension }}
          key: ${{ github.run_id }}-${{ github.sha }}-${{ steps.parse-distrib.outputs.package_extension }}-centreon-collect-${{ steps.parse-distrib.outputs.repo_distrib_name }}-${{ inputs.arch }}-${{ github.head_ref || github.ref_name }}
          fail-on-cache-miss: true

      - name: load image
        if: steps.restore-image.outputs.cache-hit == 'true'
        run: |
          docker load --input ./${{ env.IMAGE_NAME }}

      - name: Login to Registry
        if: steps.restore-image.outputs.cache-hit != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      #  pam sshd authentication doesn't work with privileged containers
      - name: ${{ matrix.feature == 'connector_ssh/connector_ssh.robot' && format('Test {0} (without privileges)', matrix.feature) || format('Test {0}', matrix.feature) }}
        run: |
          privilege_status=""
          if [[ ${{ matrix.feature }} != 'connector_ssh/connector_ssh.robot' ]]; then
            privilege_status="--privileged"
          fi
          docker run --rm $privilege_status --ulimit core=-1 --ulimit nofile=524288:1048576 --security-opt seccomp=unconfined \
            -v $(pwd):/test_collect  \
            -v  ${{ inputs.aws_web_identity_token_file }}:${{ inputs.aws_web_identity_token_file }} \
            --env AWS_WEB_IDENTITY_TOKEN_FILE=${{ inputs.aws_web_identity_token_file }} \
            --env AWS_ROLE_ARN=${{ inputs.aws_role_arn }} \
            --env AWS_BUCKET=centreon-collect-robot-report \
            --workdir /test_collect \
            ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.test_img_version }} \
            ./.github/scripts/collect-test-robot.sh \
            ${{ matrix.feature }} ${{ inputs.database_type }} ${{ inputs.tests_params }}

      # - name: Generate Xray Token
      #   id: generate-xray-token
      #   run: |
      #     token_response=$(curl -H "Content-Type: application/json" -X POST --data "{\"client_id\": \"${{ secrets.XRAY_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.XRAY_CLIENT_SECRET }}\"}" "https://xray.cloud.getxray.app/api/v1/authenticate")
      #     xray_token=$(echo "$token_response" | sed -n 's/.*"\(.*\)".*/\1/p')
      #     echo "xray_token=$xray_token" >> $GITHUB_OUTPUT
      #   shell: bash

      # - name: Send report to xrays
      #   run: |
      #     curl -H "Content-Type: multipart/form-data" -X POST -F info=@tests/issueFields.json -F results=@tests/output.xml -F testInfo=@tests/testIssueFields.json -H "Authorization: Bearer ${{ steps.generate-xray-token.outputs.xray_token }}" https://xray.cloud.getxray.app/api/v2/import/execution/robot/multipart

      - name: Move reports
        if: ${{ failure() }}
        run: |
          mkdir reports
          FILE_PREFIX=`echo "${{ matrix.feature }}" | sed -e "s#/#__#g"`-${{ needs.robot-test-list.outputs.test_group_name }}
          if [ -d tests/failed ] ; then
            cp -rp tests/failed reports/$FILE_PREFIX-failed
            cp tests/log.html reports/$FILE_PREFIX-log.html
            cp tests/output.xml reports/$FILE_PREFIX-output.xml
          fi

      - name: Replace / with - in the feature path
        id: feature-path
        if: ${{ ! cancelled() }}
        run: |
          feature_name="${{ matrix.feature }}"
          feature_name_with_dash="${feature_name//\//-}"
          echo "Modified Feature Name: $feature_name_with_dash"
          echo "feature_name_with_dash=$feature_name_with_dash" >> $GITHUB_OUTPUT

      - name: Upload Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reports-${{ needs.robot-test-list.outputs.test_group_name }}-${{ steps.feature-path.outputs.feature_name_with_dash }}
          path: reports
          retention-days: 1

  robot-test-report:
    needs: [robot-test-list, robot-test]
    if: |
      failure() &&
      ! contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: reports-${{ needs.robot-test-list.outputs.test_group_name }}-*
          path: reports
          merge-multiple: true

      - name: Upload the regrouped artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reports-${{ needs.robot-test-list.outputs.test_group_name }}
          path: reports/
          retention-days: 1

      - name: Delete separated artifacts
        run: |
          artifact_pattern="reports-${{ needs.robot-test-list.outputs.test_group_name }}-"
          TOKEN=${{ secrets.GITHUB_TOKEN }}
          artifact_exist=true
          while [ "$artifact_exist" = true ] ;do
            artifact_exist=false
            artifacts_response=$(curl -L \
                          -H "Accept: application/vnd.github+json" \
                          -H "Authorization: Bearer $TOKEN" \
                          -H "X-GitHub-Api-Version: 2022-11-28" \
                          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100")
            artifacts=$(echo $artifacts_response | jq -c '.artifacts[]')
            echo "Those are the artifacts : $artifacts"
            while read row; do
              artifact_name=$(echo "$row" | jq -r '.name')
              if [[ "$artifact_name" =~ ^.*"$artifact_pattern".* ]]; then
                artifact_exist=true
                echo "Deleting : $artifact_name"
                artifact_id=$(echo "$row" | jq -r '.id')
                curl -L \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${artifact_id}"
              fi
            done <<< "$artifacts"
          done
          echo "End of Deleting"
        shell: bash

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - run: |
          pip3 install -U robotframework robotframework-databaselibrary pymysql python-dateutil
          cd reports
          rebot -o output.xml ./*-output.xml || true
        shell: bash

      - name: Send report to commit
        uses: joonvena/robotframework-reporter-action@229b6d4248b20be6e54f4fc32c7414130d1bf200 # v2.5
        with:
          gh_access_token: ${{ secrets.GITHUB_TOKEN }}
          report_path: reports
          show_passed_tests: false
