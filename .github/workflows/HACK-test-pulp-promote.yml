# HACK(MON-212204): temporary end-to-end test of promote-docker-to-pulp-dev,
# triggered by a test-MON-212204-* tag (OIDC ref refs/tags/*, matching the
# Pulp dev grant). REMOVE BEFORE MERGE.
name: HACK test pulp promote

on:
  push:
    tags:
      - "test-MON-212204-*"

permissions:
  contents: read

jobs:
  test-promote-pulp-dev:
    runs-on: centreon-ubuntu-26.04-small
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      HARBOR_IMAGE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-trixie
      PULP_IMAGE: ${{ vars.PULP_DEV_REGISTRY }}/default/centreon/centreon-gorgone
      SOURCE_TAG: "26.11.0"
      TEST_TAG: test-pr-3888
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Harbor registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      - name: Promote to Pulp dev
        id: promote-pulp-dev
        uses: ./.github/actions/promote-docker-image
        with:
          source_image: ${{ env.HARBOR_IMAGE }}
          source_tag: ${{ env.SOURCE_TAG }}
          dest_image: ${{ env.PULP_IMAGE }}
          dest_tags: ${{ env.TEST_TAG }}
          pulp_oidc_audience: ${{ vars.PULP_DEV_OIDC_AUDIENCE }}

      - name: Verify digests and attestations
        if: always() && steps.promote-pulp-dev.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.promote-pulp-dev.outputs.digest }}
        shell: bash
        run: |
          set -x
          echo "harbor ${SOURCE_TAG}: $(crane digest "$HARBOR_IMAGE:$SOURCE_TAG")"
          echo "ghcr   ${SOURCE_TAG}: $(crane digest "ghcr.io/centreon/centreon-gorgone:$SOURCE_TAG" || true)"
          echo "pulp   ${TEST_TAG}: $(crane digest "$PULP_IMAGE:$TEST_TAG" || true)"
          echo "promoted digest: $DIGEST"
          # anonymous pull of the public distribution
          crane manifest "$PULP_IMAGE:$TEST_TAG" | jq -c '[.mediaType, [.manifests[].platform.architecture]]' || true
          for pt in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            echo "== $pt"
            gh attestation verify "oci://$PULP_IMAGE:$TEST_TAG" --owner centreon --predicate-type "$pt" --format json \
              | jq -r '.[].verificationResult.signature.certificate | "\(.buildSignerURI | sub("@.*";"")) @ \(.sourceRepositoryRef)"' \
              | sort | uniq -c || true
          done
