# HACK(MON-212218): temporary end-to-end test of promote-docker-to-pulp on Pulp prod,
# triggered by a test-MON-212218-* tag (OIDC ref refs/tags/*, matching the
# Pulp prod grant). REMOVE BEFORE MERGE.
name: HACK test pulp promote

on:
  push:
    tags:
      - "test-MON-212218-*"

permissions:
  contents: read

jobs:
  test-promote-pulp:
    runs-on: centreon-ubuntu-26.04-small
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      HARBOR_IMAGE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-trixie
      PUBLIC_IMAGE: registry.centreon.com/default/centreon/centreon-gorgone
      SOURCE_TAG: "26.11.0"
      TEST_TAG: test-mon-212218
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Harbor registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      - name: Resolve Pulp registry host
        id: pulp-registry
        env:
          PULP_API_URL: ${{ vars.PULP_API_URL }}
        run: |
          host="${PULP_API_URL#*://}"
          echo "host=${host%%/*}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Promote to Pulp
        id: promote-pulp
        uses: ./.github/actions/promote-docker-image
        with:
          source_image: ${{ env.HARBOR_IMAGE }}
          source_tag: ${{ env.SOURCE_TAG }}
          dest_image: ${{ steps.pulp-registry.outputs.host }}/default/centreon/centreon-gorgone
          dest_tags: ${{ env.TEST_TAG }}
          pulp_oidc_audience: ${{ vars.PULP_OIDC_AUDIENCE }}

      - name: Verify digests and attestations
        if: always() && steps.promote-pulp.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.promote-pulp.outputs.digest }}
        shell: bash
        run: |
          set -x
          crane auth logout registry.centreon.com || true
          echo "harbor ${SOURCE_TAG}: $(crane digest "$HARBOR_IMAGE:$SOURCE_TAG")"
          echo "public ${TEST_TAG}: $(crane digest "$PUBLIC_IMAGE:$TEST_TAG" || true)"
          echo "promoted digest: $DIGEST"
          crane manifest "$PUBLIC_IMAGE:$TEST_TAG" | jq -c '[.mediaType, [.manifests[].platform.architecture]]' || true
          for pt in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            echo "== $pt"
            gh attestation verify "oci://$PUBLIC_IMAGE:$TEST_TAG" --owner centreon --predicate-type "$pt" --format json \
              | jq -r '.[].verificationResult.signature.certificate | "\(.buildSignerURI | sub("@.*";"")) @ \(.sourceRepositoryRef)"' \
              | sort | uniq -c || true
          done
