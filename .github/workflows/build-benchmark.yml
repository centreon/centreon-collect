name: build-benchmark

# Experiment only (never merged): cold then warm build of centreon-collect with several compiler options.

on:
  push:
    branches:
      - MON-211287-build-benchmark
    paths:
      - .github/workflows/build-benchmark.yml

jobs:
  image-version:
    runs-on: centreon-ubuntu-26.04-slim
    outputs:
      packaging_img_version: ${{ steps.version.outputs.packaging_img_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Packaging image version (same hash as get-environment.yml)
        id: version
        run: |
          echo "packaging_img_version=$(cat .github/docker/Dockerfile.packaging-* vcpkg.json $(find overlays custom-triplets -type f | LC_ALL=C sort) | md5sum | awk '{print substr($1, 0, 8)}')" >> "$GITHUB_OUTPUT"
        shell: bash

  benchmark:
    needs: [image-version]
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline-1
          - baseline-2
          - g1
          - novta
          - g1-novta
          - clang
          - unity
    runs-on: centreon-ubuntu-26.04-xlarge
    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/packaging-centreon-collect-vcpkg-trixie:${{ needs.image-version.outputs.packaging_img_version }}
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}
      options: --cpus 8 --ulimit core=-1 --privileged

    name: ${{ matrix.variant }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "SCCACHE_DIR=/tmp/compiler-cache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=30G" >> "$GITHUB_ENV"
          extra=""
          relflags="-O2 -g -DNDEBUG"
          case "$VARIANT" in
            g1) relflags="-O2 -g1 -DNDEBUG" ;;
            novta) extra="-fno-var-tracking-assignments" ;;
            g1-novta) relflags="-O2 -g1 -DNDEBUG"; extra="-fno-var-tracking-assignments" ;;
            clang)
              apt-get update -q && apt-get install -y -q clang > /dev/null
              echo "CC=clang" >> "$GITHUB_ENV"
              echo "CXX=clang++" >> "$GITHUB_ENV"
              ;;
            unity) echo "UNITY=-DCMAKE_UNITY_BUILD=ON" >> "$GITHUB_ENV" ;;
          esac
          echo "EXTRA_FLAGS=$extra" >> "$GITHUB_ENV"
          echo "RELFLAGS=$relflags" >> "$GITHUB_ENV"
          mv /root/.cache /github/home/ || true
          {
            echo "### ${VARIANT} (8 CPUs)"
            echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs) / $(nproc) visible"
            if [ "$VARIANT" = clang ]; then clang++ --version | head -1; else g++ --version | head -1; fi
            echo ""
            echo "| Pass | Configure (s) | Build (s) | build dir |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Cold build, then warm build from a clean build directory
        continue-on-error: ${{ matrix.variant == 'unity' }}
        run: |
          export VCPKG_ROOT=/vcpkg VCPKG_MAX_CONCURRENCY=8 VCPKG_FORCE_SYSTEM_BINARIES=1
          export PATH=$VCPKG_ROOT:/opt/cmake-4.3.3/bin:$PATH
          /usr/bin/sccache --start-server
          build() {
            rm -rf build
            local start configured end
            start=$(date +%s)
            CXXFLAGS="-Wall -Wextra $EXTRA_FLAGS" CFLAGS="$EXTRA_FLAGS" cmake -B build \
              -DVCPKG_OVERLAY_TRIPLETS=/custom-triplets -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_OVERLAY_PORTS=/overlays \
              -GNinja -DDEBUG_ROBOT=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=$RELFLAGS" "-DCMAKE_C_FLAGS_RELWITHDEBINFO=$RELFLAGS" \
              -DWITH_TESTING=On -DWITH_MODULE_SIMU=On \
              -DWITH_PREFIX=/usr -DWITH_PREFIX_BIN=/usr/sbin -DWITH_PREFIX_MODULES=/usr/share/centreon/lib/centreon-broker \
              -DWITH_PREFIX_LIB_ENGINE=/usr/lib64/centreon-engine -DWITH_PREFIX_LIB_CLIB=/usr/lib64/ \
              -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/sccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/sccache \
              ${UNITY:-} -DLEGACY_ENGINE=OFF -DONLY_ROBOT_CMA=OFF -S . > /dev/null
            configured=$(date +%s)
            ninja -j 8 -C build > "ninja-$1.log" 2>&1 || { tail -30 "ninja-$1.log"; echo "| $1 | $((configured - start)) | FAILED | - |" >> "$GITHUB_STEP_SUMMARY"; return 1; }
            end=$(date +%s)
            local size
            size=$(du -sh build | cut -f1)
            echo "$1: configure $((configured - start)) s, build $((end - configured)) s, build dir $size"
            echo "| $1 | $((configured - start)) | $((end - configured)) | $size |" >> "$GITHUB_STEP_SUMMARY"
          }
          build cold
          /usr/bin/sccache --zero-stats > /dev/null
          build warm
          {
            echo '```'
            /usr/bin/sccache --show-stats | grep -E 'Compile requests|Cache hits|Cache misses|Non-cacheable'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
