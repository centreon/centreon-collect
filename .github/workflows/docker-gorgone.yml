name: docker-gorgone

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
      - "release-[2-9][0-9].[0-9][0-9]-next"
      - "hotfix-[2-9][0-9].[0-9][0-9]-next"
    paths:
      - '.github/docker/centreon-gorgone/**'
      - 'gorgone/**'
      - 'perl-libs/**'
      - '.github/workflows/docker-gorgone.yml'
    tags:
      - "centreon-gorgone-*"
  pull_request:
    paths:
      - '.github/docker/centreon-gorgone/**'
      - 'gorgone/**'
      - 'perl-libs/**'
      - '.github/workflows/docker-gorgone.yml'

jobs:
  get-environment:
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: .version.centreon-gorgone

  package:
    needs: [get-environment]
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_extension: deb
            image: packaging-centreon-collect-trixie
            distrib: trixie
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ matrix.image }}:${{ needs.get-environment.outputs.packaging_img_version }}
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

    name: package ${{ matrix.distrib }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set package version and paths according to distrib
        run: |
          if [[ "${{ matrix.package_extension }}" == "deb" ]]; then
            PERL_VENDORLIB="/usr/share/perl5"
          else
            PERL_VENDORLIB="/usr/share/perl5/vendor_perl"
          fi
          echo "PERL_VENDORLIB=$PERL_VENDORLIB" >> $GITHUB_ENV
        shell: bash

      - name: Generate selinux binaries
        if: ${{ matrix.package_extension == 'rpm' }}
        run: |
          cd gorgone/selinux
          sed -i "s/@VERSION@/${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}/g" centreon-gorgoned.te
          make -f /usr/share/selinux/devel/Makefile
        shell: bash

      - name: Remove selinux packaging files on debian
        if: ${{ matrix.package_extension == 'deb' }}
        run: rm -f gorgone/packaging/*-selinux.yaml
        shell: bash

      - name: Package
        uses: ./.github/actions/package
        with:
          nfpm_file_pattern: "gorgone/packaging/*.yaml perl-libs/packaging/*.yaml"
          module_name: "centreon-gorgone"
          distrib: ${{ matrix.distrib }}
          package_extension: ${{ matrix.package_extension }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          release: ${{ needs.get-environment.outputs.release }}
          arch: all
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.package_extension }}-${{ matrix.distrib }}
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          stability: ${{ needs.get-environment.outputs.stability }}
          upload_artifacts: ${{ needs.get-environment.outputs.is_nightly == 'true' || contains(needs.get-environment.outputs.labels, 'upload-artifacts') && 'true' || 'false' }}

  dockerize:
    needs: [get-environment, package]
    if: needs.get-environment.outputs.stability != 'stable'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
    name: dockerize centreon-gorgone-${{ matrix.operating_system }}
    env:
      project: centreon-gorgone
    # Matrix job outputs come from the last completed matrix leg; safe only while
    # operating_system has a single value (trixie). Revisit if this matrix grows.
    outputs:
      image_tag: ${{ steps.compute-tag.outputs.tag }}
      additional_tag: ${{ steps.compute-tag.outputs.additional_tag }}
      version_tag: ${{ steps.compute-tag.outputs.version_tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Parse distrib name
        id: parse-distrib
        uses: ./.github/actions/parse-distrib
        with:
          distrib: ${{ matrix.operating_system }}

      - name: get cached gorgone and perl-libs package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./*.${{ steps.parse-distrib.outputs.package_extension }}
          key: ${{ github.sha }}-${{ github.run_id }}-${{ steps.parse-distrib.outputs.package_extension }}-${{ steps.parse-distrib.outputs.package_extension == 'rpm' && steps.parse-distrib.outputs.distrib_family || steps.parse-distrib.outputs.distrib_name }}
          fail-on-cache-miss: true

      - run: |
          mkdir packages-centreon
          mv *.${{ steps.parse-distrib.outputs.package_extension }} packages-centreon/
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Compute Docker tag
        id: compute-tag
        env:
          RAW_REF: ${{ github.head_ref || github.ref_name }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          MINOR_VERSION: ${{ needs.get-environment.outputs.minor_version }}
        run: |
          if [[ "$RAW_REF" == "develop" ]]; then
            echo "tag=develop-${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=develop" >> "$GITHUB_OUTPUT"
          elif [[ "$RAW_REF" =~ ^dev-[0-9]+\.[0-9]+\.x$ ]]; then
            echo "tag=${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=" >> "$GITHUB_OUTPUT"
          else
            docker_tag=$(printf '%s' "$RAW_REF" | sed -E 's#[^[:alnum:]_.-]+#-#g; s#^[.-]+##; s#-+#-#g' | cut -c1-128)
            if [[ -z "$docker_tag" ]]; then
              echo "::error::Unable to derive a valid Docker tag from ref '$RAW_REF'"
              exit 1
            fi
            echo "tag=${docker_tag}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=" >> "$GITHUB_OUTPUT"
          fi

          # On a release/hotfix branch (stability 'testing'), also tag with the
          # deterministic target version (e.g. 26.10.5). promote-docker-to-ghcr
          # pulls this exact tag on the eventual stable event — computed the same
          # way from the same version file, so no release_type reconstruction is
          # needed to find the candidate to promote.
          if [[ "$RAW_REF" =~ ^(release|hotfix)-[0-9]+\.[0-9]+-next$ ]]; then
            echo "version_tag=${MAJOR_VERSION}.${MINOR_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Docker build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: .github/docker/centreon-gorgone/${{ matrix.operating_system }}/Dockerfile
          build-args: |
            "VERSION=${{ needs.get-environment.outputs.major_version }}"
            "IS_CLOUD=${{ needs.get-environment.outputs.is_cloud }}"
            "STABILITY=${{ needs.get-environment.outputs.stability }}"
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}:${{ steps.compute-tag.outputs.tag }}
            ${{ steps.compute-tag.outputs.version_tag && format('{0}/centreon-gorgone-{1}:{2}', vars.DOCKER_INTERNAL_REGISTRY_URL, matrix.operating_system, steps.compute-tag.outputs.version_tag) }}
          secrets: |
            "ARTIFACTORY_INTERNAL_REPO_USERNAME=${{ secrets.ARTIFACTORY_INTERNAL_REPO_USERNAME }}"
            "ARTIFACTORY_INTERNAL_REPO_PASSWORD=${{ secrets.ARTIFACTORY_INTERNAL_REPO_PASSWORD }}"

  docker-boot-test:
    needs: [get-environment, dockerize]
    if: |
      ! cancelled() &&
      needs.get-environment.result == 'success' &&
      needs.dockerize.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
        platform: [linux/amd64, linux/arm64]
    name: docker boot test centreon-gorgone-${{ matrix.operating_system }} (${{ matrix.platform }})
    env:
      GORGONE_IMAGE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}:${{ needs.dockerize.outputs.image_tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - name: Set up QEMU
        if: ${{ matrix.platform == 'linux/arm64' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Replace / with - in the platform name
        id: platform-name
        run: echo "dashed=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Pull image for ${{ matrix.platform }}
        run: docker pull --platform "${{ matrix.platform }}" "$GORGONE_IMAGE"
        shell: bash

      - name: Run boot test
        env:
          IMAGE: ${{ env.GORGONE_IMAGE }}
          PLATFORM: ${{ matrix.platform }}
        run: ./.github/scripts/gorgone-docker-boot-test.sh
        shell: bash

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: centreon-gorgone-boot-test-${{ matrix.operating_system }}-${{ steps.platform-name.outputs.dashed }}
          path: /tmp/gorgone-boot-test.log
          retention-days: 1

  docker-config-wiring-test:
    needs: [get-environment, dockerize]
    if: |
      ! cancelled() &&
      needs.get-environment.result == 'success' &&
      needs.dockerize.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
    name: docker config/wiring test centreon-gorgone-${{ matrix.operating_system }}
    env:
      GORGONE_IMAGE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}:${{ needs.dockerize.outputs.image_tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - name: Pull image
        run: docker pull --platform linux/amd64 "$GORGONE_IMAGE"
        shell: bash

      - name: Run config/wiring test scenarios
        env:
          IMAGE: ${{ env.GORGONE_IMAGE }}
        run: ./.github/scripts/gorgone-docker-config-wiring-test.sh
        shell: bash

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f .github/docker/centreon-gorgone/docker-compose.config-wiring-test.yml -p gorgone-config-wiring-test logs
        shell: bash

  promote-docker-tag:
    needs: [get-environment, dockerize, docker-boot-test, docker-config-wiring-test]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.dockerize.outputs.additional_tag != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
    name: promote centreon-gorgone-${{ matrix.operating_system }} floating tag
    steps:
      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Promote floating tag (manifest retag, no rebuild)
        run: |
          docker buildx imagetools create \
            --tag "${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}:${{ needs.dockerize.outputs.additional_tag }}" \
            "${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}:${{ needs.dockerize.outputs.image_tag }}"
        shell: bash

  promote-docker-to-ghcr:
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.stability == 'stable' &&
      github.event_name != 'workflow_dispatch' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    runs-on: centreon-ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
    name: promote centreon-gorgone-${{ matrix.operating_system }} to ghcr.io stable
    # HARBOR_TAG is the deterministic target version (major_version.minor_version)
    # that dockerize tagged the image with while its release/hotfix branch was
    # 'testing' (see the "Compute Docker tag" step's version_tag output). Computed
    # identically here from the same version file, so no release_type/branch-name
    # reconstruction is needed to find the candidate to promote.
    env:
      HARBOR_IMAGE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}
      HARBOR_TAG: ${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Harbor registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify Harbor candidate exists
        # Hard failure, unlike the promote step below: a missing candidate means
        # our own release pipeline didn't produce what this stable release needs
        # to promote, not a ghcr.io-side hiccup — this must never be silently
        # swallowed.
        run: |
          if ! docker buildx imagetools inspect "$HARBOR_IMAGE:$HARBOR_TAG" > /dev/null; then
            echo "::error::No candidate image found on Harbor for $HARBOR_IMAGE:$HARBOR_TAG — the testing build for this version may not have run, or version_tag wasn't pushed. Check the dockerize job on the release/hotfix branch for centreon-gorgone-${{ needs.get-environment.outputs.major_version }}."
            exit 1
          fi
        shell: bash

      - name: Promote Harbor candidate to ghcr.io stable (best-effort, non-blocking)
        continue-on-error: true
        id: promote-ghcr
        env:
          GHCR_IMAGE: ghcr.io/centreon/centreon-gorgone
          GHCR_TAGS: ${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }} ${{ needs.get-environment.outputs.major_version }}
          PLATFORMS: linux/amd64,linux/arm64
        run: bash .github/scripts/docker-push-to-ghcr.sh
        shell: bash

      - name: Warn if ghcr.io stable delivery failed
        if: steps.promote-ghcr.outcome == 'failure'
        run: |
          echo "::warning::ghcr.io delivery failed for centreon-gorgone-${{ matrix.operating_system }} (Harbor tag $HARBOR_TAG). This release is available on Harbor but was NOT published to ghcr.io — investigate before relying on public delivery for this version."
        shell: bash
