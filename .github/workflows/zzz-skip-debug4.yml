name: zzz-skip-debug4

on:
  push:
    branches:
      - MON-203184-add-e2e-runtime-tests-centreon-engine

jobs:
  get-environment:
    uses: ./.github/workflows/zzz-fake-reusable.yml

  get-aws-environment:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "fake get-aws-environment"

  changes:
    needs: [get-environment]
    uses: ./.github/workflows/zzz-fake-reusable.yml

  package:
    needs: [get-environment]
    uses: ./.github/workflows/zzz-fake-reusable.yml

  # Verbatim copy of collect.yml's dockerize-engine-broker: needs, if:, strategy,
  # outputs, name - only the steps are replaced with an echo.
  dockerize-engine-broker:
    needs: [get-environment, get-aws-environment, changes, package]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      (
        needs.get-environment.outputs.is_nightly == 'true' ||
        contains(needs.get-environment.outputs.labels, 'build-docker-collect')
      ) &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [centreon-engine, centreon-broker]
        distrib: [trixie]

    name: dockerize ${{ matrix.image }}-${{ matrix.distrib }}

    outputs:
      image_tag: ${{ steps.compute-tag.outputs.tag }}

    steps:
      - id: compute-tag
        run: echo "tag=v1" >> "$GITHUB_OUTPUT"

  # Verbatim copy of collect.yml's docker-boot-test: needs, strategy, name, env
  # (referencing needs.dockerize-engine-broker.outputs.image_tag) - no if:,
  # only the steps are replaced with an echo.
  docker-boot-test:
    needs: [get-environment, dockerize-engine-broker]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distrib: [trixie]
        platform: [linux/amd64, linux/arm64]
    name: docker boot test centreon-engine-${{ matrix.distrib }} (${{ matrix.platform }})
    env:
      ENGINE_IMAGE: fake-registry/centreon-engine-${{ matrix.distrib }}:${{ needs.dockerize-engine-broker.outputs.image_tag }}
    steps:
      - run: echo "ran, ENGINE_IMAGE=$ENGINE_IMAGE"

  docker-config-wiring-test:
    needs: [get-environment, dockerize-engine-broker]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distrib: [trixie]
    name: docker config/wiring test centreon-engine-${{ matrix.distrib }}
    env:
      ENGINE_IMAGE: fake-registry/centreon-engine-${{ matrix.distrib }}:${{ needs.dockerize-engine-broker.outputs.image_tag }}
    steps:
      - run: echo "ran, ENGINE_IMAGE=$ENGINE_IMAGE"

  # Diagnostic twin: same needs/matrix, but if: always() so it runs regardless,
  # and prints the real needs context this job sees.
  docker-boot-test-debug:
    needs: [get-environment, dockerize-engine-broker]
    runs-on: ubuntu-24.04
    if: always()
    strategy:
      fail-fast: false
      matrix:
        distrib: [trixie]
        platform: [linux/amd64, linux/arm64]
    name: debug4-toJSON-${{ matrix.distrib }} (${{ matrix.platform }})
    steps:
      - run: echo '${{ toJSON(needs) }}'
