name: prune-old-caches

on:
  schedule:
    - cron: "0 1 * * *"  # 1 AM UTC daily, runs on the default branch
  workflow_dispatch:
    inputs:
      days_threshold:
        description: "Delete caches not accessed in the last N days"
        required: false
        default: "3"
        type: string

jobs:
  prune:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Prune stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days_threshold || '3' }}
        run: |
          REPO="${{ github.repository }}"
          CUTOFF=$(date -u -d "${DAYS} days ago" --iso-8601=seconds)

          echo "Pruning caches last accessed before: $CUTOFF"

          # Report current cache usage before pruning
          read -r active_count active_bytes < <(
            gh api "repos/$REPO/actions/cache/usage" \
              --jq '[.active_caches_count, .active_caches_size_in_bytes] | @tsv'
          )
          echo "Current usage: $((active_bytes / 1024 / 1024)) MB across ${active_count} cache(s) (limit: ~10240 MB)"

          # Collect IDs of stale caches (using ID avoids ambiguity across refs)
          mapfile -t stale_ids < <(
            gh api "repos/$REPO/actions/caches" --paginate \
              --jq ".actions_caches[] | select(.last_accessed_at < \"$CUTOFF\") | .id"
          )

          if [ ${#stale_ids[@]} -eq 0 ]; then
            echo "No stale caches found."
            exit 0
          fi

          echo "Found ${#stale_ids[@]} stale cache(s) to delete."
          set +e
          deleted=0
          for cache_id in "${stale_ids[@]}"; do
            if gh api -X DELETE "repos/$REPO/actions/caches/$cache_id" > /dev/null 2>&1; then
              echo "Deleted cache ID: $cache_id"
              ((deleted++))
            else
              echo "Failed to delete cache ID: $cache_id (may have already expired)"
            fi
          done

          echo "Prune complete: ${deleted}/${#stale_ids[@]} cache(s) deleted."
