name: gorgone

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      unit_tests:
        description: 'Execute the unit tests'
        required: true
        default: true
        type: boolean
  pull_request:
    # paths:
    #   - ".version"
    #   - ".version.centreon-gorgone"
    #   - "gorgone/**"
    #   - "perl-libs/**"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
      - master
      - "[2-9][0-9].[0-9][0-9].x"
      - 'release-[2-9][0-9].[0-9][0-9]-next'
      - 'hotfix-[2-9][0-9].[0-9][0-9]-next'
    paths:
      - ".version"
      - ".version.centreon-gorgone"
      - "gorgone/**"
      - "perl-libs/**"
    tags:
      - "centreon-gorgone-*"

env:
  base_directory: gorgone

jobs:
  get-environment:
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: .version.centreon-gorgone

  changes:
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    runs-on: ubuntu-24.04
    outputs:
      trigger_delivery: ${{ steps.filter.outputs.trigger_delivery || 'true' }}
      trigger_unit_tests: ${{ steps.filter.outputs.trigger_unit_tests || 'true' }}
      trigger_robot_tests: ${{ steps.filter.outputs.trigger_robot_tests || 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: |
          github.event_name == 'pull_request' &&
          needs.get-environment.outputs.stability != 'testing'
        with:
          base: ${{ github.head_ref || github.ref_name }}
          filters: |
            trigger_unit_tests:
              - 'gorgone/**'
              - 'perl-libs/**'
            trigger_robot_tests:
              - 'gorgone/!(tests)/**'
              - 'gorgone/tests/robot/**'
              - 'perl-libs/**'
              - '.github/**'
            trigger_delivery:
              - 'gorgone/!(tests)/**'
              - 'perl-libs/!(lib)/**'
              - 'perl-libs/lib/!(t)/**'
              - 'perl-libs/*'
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

