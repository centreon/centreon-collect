name: gorgone

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      labels:
        description: "Labels to add to the run (comma separated)"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/gorgone.yml"
      - ".version"
      - ".version.centreon-gorgone"
      - "gorgone/**"
      - "perl-libs/**"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
      - master
      - "[2-9][0-9].[0-9][0-9].x"
      - 'release-[2-9][0-9].[0-9][0-9]-next'
      - 'hotfix-[2-9][0-9].[0-9][0-9]-next'
    paths:
      - ".version"
      - ".version.centreon-gorgone"
      - "gorgone/**"
      - "perl-libs/**"
    tags:
      - "centreon-gorgone-*"

env:
  base_directory: gorgone

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  get-environment:
    needs: [dependency-scan]
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: .version.centreon-gorgone
      labels: ${{ inputs.labels || '' }}

  changes:
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    needs: [get-environment]
    uses: ./.github/workflows/get-changes-triggers.yml
    with:
      production_paths: |
        ".version"
        ".version.centreon-gorgone"
        "gorgone/**"
        "perl-libs/**"
        "!gorgone/tests/**"
      unit_test_paths: |
        "gorgone/tests/unit/**"
      e2e_test_paths: |
        "gorgone/tests/robot/**"
        ".github/docker/centreon-gorgone/**"
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
      base_sha: ${{ needs.get-environment.outputs.previous_release_bundle_tag }}
      labels: ${{ needs.get-environment.outputs.labels }}

  unit-test-perl:
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_unit_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/unit-tests-${{ matrix.operating_system }}
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

    name: unit tests ${{ matrix.operating_system }}

    services:
      mariadb:
        image: mariadb:11.8
        ports:
          - 3306
        env:
          MYSQL_USER: centreon
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password

    steps:
      - name: Get linked branch of centreon repository
        id: centreon_repo_linked_branch
        env:
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          GH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          CENTREON_REPO_LINKED_BRANCH=$(git ls-remote -h https://github.com/centreon/centreon.git | grep -E "refs/heads/dev-${MAJOR_VERSION}\.x$" >/dev/null 2>&1 && echo "dev-${MAJOR_VERSION}.x" || echo develop)

          GIT_BRANCH_EXISTS=$(git ls-remote -h https://github.com/centreon/centreon.git | grep -E "refs/heads/${GH_REF}$" >/dev/null 2>&1 && echo yes || echo no)
          if [[ "$GIT_BRANCH_EXISTS" == "yes" ]]; then
            CENTREON_REPO_LINKED_BRANCH="$GH_REF"
          fi

          echo "linked_branch=$CENTREON_REPO_LINKED_BRANCH" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: centreon/centreon
          path: centreon
          ref: ${{ steps.centreon_repo_linked_branch.outputs.linked_branch }}
          sparse-checkout: |
            centreon/www/install/createTables.sql
            centreon/www/install/createTablesCentstorage.sql

      - name: wait mariadb initialization before creating databases
        run: |
          hostname=mariadb
          max_attempts=20
          attempt_num=1
          echo "trying to access the database at $hostname"
          set +e
          while [ $attempt_num -le $max_attempts ]; do
            output=$(mysql -h "$hostname" -u root -ppassword -e "SELECT 1;" 2>&1)
            status=$?
            if [ $status -eq 0 ]; then
              echo "Attempt $attempt_num succeeded. Database is accessible."
              exit 0
            fi
            echo "Attempt $attempt_num failed. Trying again in one second..."
            sleep 1
            attempt_num=$(( attempt_num + 1 ))
          done
          echo "failed accessing the database at $hostname after $max_attempts attempts : $output"
          exit 1

      - name: Create databases
        run: |
          mysql -h mariadb -u root -ppassword -e "CREATE DATABASE \`centreon\`"
          mysql -h mariadb -u root -ppassword -e "CREATE DATABASE \`centreon-storage\`"
          mysql -h mariadb -u root -ppassword -e "CREATE DATABASE \`centreon-remote\`"
          mysql -h mariadb -u root -ppassword -e "GRANT ALL PRIVILEGES ON centreon.* TO 'centreon'@'%'"
          mysql -h mariadb -u root -ppassword -e "GRANT ALL PRIVILEGES ON  \`centreon-remote\`.* TO 'centreon'@'%'"
          mysql -h mariadb -u root -ppassword -e "GRANT ALL PRIVILEGES ON  \`centreon-storage\`.* TO 'centreon'@'%'"
          mysql -h mariadb -u root -ppassword 'centreon' < centreon/centreon/www/install/createTables.sql
          mysql -h mariadb -u root -ppassword 'centreon-remote' < centreon/centreon/www/install/createTables.sql
          mysql -h mariadb -u root -ppassword 'centreon-storage' < centreon/centreon/www/install/createTablesCentstorage.sql

      - name: Run unit tests
        run: yath -L test ./perl-libs/lib/ ./gorgone/tests/unit/

      - name: Upload logs as artifacts if tests failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: centreon-collect-perl-unit-tests-${{ matrix.operating_system }}
          path: ./lastlog.jsonl
          retention-days: 1

  package:
    needs: [get-environment, changes, unit-test-perl]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}

    runs-on: ubuntu-24.04

    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/packaging-centreon-collect-${{ matrix.operating_system }}:${{ needs.get-environment.outputs.packaging_img_version }}
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

    name: package ${{ matrix.operating_system }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse distrib name
        id: parse-distrib
        uses: ./.github/actions/parse-distrib
        with:
          distrib: ${{ matrix.operating_system }}

      - name: Set package version and paths according to distrib
        env:
          PACKAGE_EXTENSION: ${{ steps.parse-distrib.outputs.package_extension }}
        run: |
          if [[ "$PACKAGE_EXTENSION" == "deb" ]]; then
            PERL_VENDORLIB="/usr/share/perl5"
          else
            PERL_VENDORLIB="/usr/share/perl5/vendor_perl"
          fi
          echo "PERL_VENDORLIB=$PERL_VENDORLIB" >> $GITHUB_ENV
        shell: bash

      - name: Generate selinux binaries
        if: ${{ steps.parse-distrib.outputs.package_extension == 'rpm' }}
        env:
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          MINOR_VERSION: ${{ needs.get-environment.outputs.minor_version }}
        run: |
          cd gorgone/selinux
          sed -i "s/@VERSION@/$MAJOR_VERSION.$MINOR_VERSION/g" centreon-gorgoned.te
          make -f /usr/share/selinux/devel/Makefile
        shell: bash

      - name: Remove selinux packaging files on debian
        if: ${{ steps.parse-distrib.outputs.package_extension == 'deb' }}
        run: rm -f gorgone/packaging/*-selinux.yaml
        shell: bash

      - name: Package
        uses: ./.github/actions/package
        with:
          nfpm_file_pattern: "gorgone/packaging/*.yaml perl-libs/packaging/*.yaml"
          module_name: "centreon-gorgone"
          distrib: ${{ matrix.operating_system }}
          package_extension: ${{ steps.parse-distrib.outputs.package_extension }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          release: ${{ needs.get-environment.outputs.release }}
          arch: all
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ steps.parse-distrib.outputs.package_extension }}-${{ steps.parse-distrib.outputs.repo_distrib_name }}
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          stability: ${{ needs.get-environment.outputs.stability }}
          upload_artifacts: ${{ needs.get-environment.outputs.is_nightly == 'true' || contains(needs.get-environment.outputs.labels, 'upload-artifacts') && 'true' || 'false' }}

  dockerize:
    needs: [get-environment, changes, package]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: dockerize ${{ matrix.operating_system }}
    env:
      project: gorgone-testing
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Parse distrib name
        id: parse-distrib
        uses: ./.github/actions/parse-distrib
        with:
          distrib: ${{ matrix.operating_system }}

      - name: Compute Docker tag
        id: docker-tag
        uses: ./.github/actions/compute-docker-tag
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Compute base ref Docker tag
        id: base-docker-tag
        uses: ./.github/actions/compute-docker-tag
        with:
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Get FROM image tag
        id: from_image_version
        env:
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          OPERATING_SYSTEM: ${{ matrix.operating_system }}
          REGISTRY_URL: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          GH_HEAD_REF: ${{ steps.docker-tag.outputs.tag }}
          GH_BASE_REF: ${{ steps.base-docker-tag.outputs.tag }}
          PROJECT: ${{ env.project }}
        run: |
          FROM_IMAGE_VERSION="$MAJOR_VERSION"
          FROM_IMAGE="gorgone-testing-dependencies-$OPERATING_SYSTEM"
          IMAGE_TAG_EXISTS=$(docker manifest inspect "$REGISTRY_URL/${FROM_IMAGE}:$GH_HEAD_REF" >/dev/null 2>&1 && echo yes || echo no)
          if [[ "$IMAGE_TAG_EXISTS" == "yes" ]]; then
            FROM_IMAGE_VERSION="$GH_HEAD_REF"
            echo "::notice::FROM image $FROM_IMAGE:$FROM_IMAGE_VERSION will be used to build docker image $PROJECT-$OPERATING_SYSTEM."
          else
            IMAGE_TAG_EXISTS=$(docker manifest inspect "$REGISTRY_URL/${FROM_IMAGE}:$GH_BASE_REF" >/dev/null 2>&1 && echo yes || echo no)
            if [[ "$IMAGE_TAG_EXISTS" == "yes" ]]; then
              FROM_IMAGE_VERSION="$GH_BASE_REF"
              echo "::notice::FROM image $FROM_IMAGE:$FROM_IMAGE_VERSION will be used to build docker image $PROJECT-$OPERATING_SYSTEM."
            fi
          fi

          echo "from_image_version=$FROM_IMAGE_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: get cached gorgone and perl-libs package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./*.${{ steps.parse-distrib.outputs.package_extension }}
          key: ${{ github.sha }}-${{ github.run_id }}-${{ steps.parse-distrib.outputs.package_extension }}-${{ steps.parse-distrib.outputs.repo_distrib_name }}
          fail-on-cache-miss: true

      - env:
          PACKAGE_EXTENSION: ${{ steps.parse-distrib.outputs.package_extension }}
        run: |
          mkdir packages-centreon-gorgone
          mv *."$PACKAGE_EXTENSION" packages-centreon-gorgone/
        shell: bash

      - name: Get linked branch of centreon repository
        id: centreon_repo_linked_branch
        env:
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          GH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          CENTREON_REPO_LINKED_BRANCH=$(git ls-remote -h https://github.com/centreon/centreon.git | grep -E "refs/heads/dev-${MAJOR_VERSION}\.x$" >/dev/null 2>&1 && echo "dev-${MAJOR_VERSION}.x" || echo develop)

          GIT_BRANCH_EXISTS=$(git ls-remote -h https://github.com/centreon/centreon.git | grep -E "refs/heads/${GH_REF}$" >/dev/null 2>&1 && echo yes || echo no)
          if [[ "$GIT_BRANCH_EXISTS" == "yes" ]]; then
            CENTREON_REPO_LINKED_BRANCH="$GH_REF"
          fi

          echo "linked_branch=$CENTREON_REPO_LINKED_BRANCH" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: centreon/centreon
          path: centreon
          ref: ${{ steps.centreon_repo_linked_branch.outputs.linked_branch }}
          sparse-checkout: |
            centreon/www/install/createTables.sql
            centreon/www/install/createTablesCentstorage.sql

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: .github/docker/gorgone/${{ matrix.operating_system }}/Dockerfile.testing
          build-args: |
            "REGISTRY_URL=${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}"
            "FROM_IMAGE_VERSION=${{ steps.from_image_version.outputs.from_image_version }}"
          pull: true
          push: true
          load: true
          tags: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/gorgone-testing-${{ matrix.operating_system }}:${{ steps.docker-tag.outputs.tag }}

      - name: Store image in local archive
        env:
          REGISTRY_URL: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          OPERATING_SYSTEM: ${{ matrix.operating_system }}
          GH_REF: ${{ steps.docker-tag.outputs.tag }}
        run: |
          docker tag "$REGISTRY_URL/gorgone-testing-$OPERATING_SYSTEM:$GH_REF" "gorgone-testing-$OPERATING_SYSTEM:$GH_REF"
          mkdir -p docker-image
          docker save --output "./docker-image/gorgone-testing-$OPERATING_SYSTEM.tar" "gorgone-testing-$OPERATING_SYSTEM:$GH_REF"
        shell: bash

      - name: Clear previous docker image from cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATING_SYSTEM: ${{ matrix.operating_system }}
          GH_REF: ${{ steps.docker-tag.outputs.tag }}
        run: |
          curl \
            -X DELETE \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/centreon/centreon-collect/actions/caches?key=docker-image-gorgone-testing-$OPERATING_SYSTEM-$GH_REF"
        shell: bash

      - name: Store docker image in cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./docker-image
          key: docker-image-gorgone-testing-${{ matrix.operating_system }}-${{ steps.docker-tag.outputs.tag }}

  robot-test:
    needs: [get-environment, changes, dockerize]
    if: |
      github.repository == 'centreon/centreon-collect' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: robot-test ${{ matrix.operating_system }}
    uses: ./.github/workflows/robot-test-gorgone.yml
    with:
      distrib: ${{ matrix.operating_system }}
    secrets:
      registry_username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
      registry_password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

  # The centreon-gorgone-trixie product image (MON-207531): folded into this
  # workflow, rather than kept in a standalone docker-gorgone.yml, so it
  # inherits the same trigger paths (a version bump alone is enough to produce
  # a fresh candidate, same as deliver-rpm/deliver-deb below) and the same
  # robot-test gate — it only runs once robot-test has passed or was skipped
  # (no e2e-relevant changes), never after a real failure, instead of racing
  # ahead of it as the old standalone workflow did. Named "dockerize-image"
  # (not "dockerize") to avoid colliding with the internal gorgone-testing-*
  # dependency image job above. This job alone doesn't guarantee the resulting
  # image is validated: docker-boot-test/docker-config-wiring-test below are
  # what actually gate version_tag and promote-docker-tag/promote-docker-to-ghcr.
  dockerize-image:
    needs: [get-environment, changes, package, robot-test]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      contains(fromJson('["testing", "unstable"]'), needs.get-environment.outputs.stability) &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
    name: dockerize centreon-gorgone-${{ matrix.operating_system }}
    # Matrix job outputs come from the last completed matrix leg; safe only while
    # operating_system has a single value (trixie). Revisit if this matrix grows.
    outputs:
      image_tag: ${{ steps.compute-tag.outputs.tag }}
      additional_tag: ${{ steps.compute-tag.outputs.additional_tag }}
      version_tag: ${{ steps.compute-tag.outputs.version_tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: get cached gorgone and perl-libs package
        # Reuses the trixie/deb artifact already produced and cached by this
        # workflow's own "package" job above (same nfpm_file_pattern/module_name,
        # same cache key shape) — no separate/duplicate package build needed.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./*.deb
          key: ${{ github.sha }}-${{ github.run_id }}-deb-trixie
          fail-on-cache-miss: true

      - run: |
          mkdir packages-centreon
          mv *.deb packages-centreon/
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Compute Docker tag
        id: compute-tag
        env:
          RAW_REF: ${{ github.head_ref || github.ref_name }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          MINOR_VERSION: ${{ needs.get-environment.outputs.minor_version }}
        run: |
          if [[ "$RAW_REF" == "develop" ]]; then
            echo "tag=develop-${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=develop" >> "$GITHUB_OUTPUT"
          elif [[ "$RAW_REF" =~ ^dev-[0-9]+\.[0-9]+\.x$ ]]; then
            echo "tag=${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=" >> "$GITHUB_OUTPUT"
          else
            docker_tag=$(printf '%s' "$RAW_REF" | sed -E 's#[^[:alnum:]_.-]+#-#g; s#^[.-]+##; s#-+#-#g' | cut -c1-128)
            if [[ -z "$docker_tag" ]]; then
              echo "::error::Unable to derive a valid Docker tag from ref '$RAW_REF'"
              exit 1
            fi
            echo "tag=${docker_tag}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=" >> "$GITHUB_OUTPUT"
          fi

          # On a release/hotfix branch (stability 'testing'), also tag with the
          # deterministic target version (e.g. 26.10.5). promote-docker-to-ghcr
          # pulls this exact tag on the eventual stable event — computed the same
          # way from the same version file, so no release_type reconstruction is
          # needed to find the candidate to promote. This job only runs after
          # robot-test succeeds, so this candidate is e2e-tested before it can
          # ever be promoted to ghcr.io stable.
          # TEMP TEST HACK (MON-207622) — remove the branch-name alternative
          # below before merging PR #3647.
          if [[ "$RAW_REF" =~ ^(release|hotfix)-[0-9]+\.[0-9]+-next$ ]] || [[ "$RAW_REF" == "MON-207622-provenance-attestation-sbom-ghcr" ]]; then
            echo "version_tag=${MAJOR_VERSION}.${MINOR_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Docker build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: .github/docker/centreon-gorgone/${{ matrix.operating_system }}/Dockerfile
          build-args: |
            "VERSION=${{ needs.get-environment.outputs.major_version }}"
            "IS_CLOUD=${{ needs.get-environment.outputs.is_cloud }}"
            "STABILITY=${{ needs.get-environment.outputs.stability }}"
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          # Disabled: BuildKit's own attestation manifests would make this
          # digest diverge from the ghcr.io one docker-push-to-ghcr.sh
          # reconstructs later.
          provenance: false
          sbom: false
          # version_tag is deliberately NOT pushed here: it's only applied by
          # promote-docker-version-tag below, once docker-boot-test/
          # docker-config-wiring-test have validated this exact image. Pushing
          # it here (before those tests run) would let promote-docker-to-ghcr
          # pick up an unvalidated candidate on a later, separate stable run.
          tags: |
            ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}:${{ steps.compute-tag.outputs.tag }}
          secrets: |
            "ARTIFACTORY_INTERNAL_REPO_USERNAME=${{ secrets.ARTIFACTORY_INTERNAL_REPO_USERNAME }}"
            "ARTIFACTORY_INTERNAL_REPO_PASSWORD=${{ secrets.ARTIFACTORY_INTERNAL_REPO_PASSWORD }}"

      - name: Attest build provenance (deterministic candidate only)
        # Only for builds with a version_tag (real promotion candidates).
        # push-to-registry:false since ghcr.io doesn't have this image yet;
        # discoverable later by digest once promoted.
        if: steps.compute-tag.outputs.version_tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/centreon/centreon-gorgone
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
          create-storage-record: false

  docker-boot-test:
    needs: [get-environment, dockerize-image]
    if: |
      ! cancelled() &&
      needs.get-environment.result == 'success' &&
      needs.dockerize-image.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
        platform: [linux/amd64, linux/arm64]
    name: docker boot test centreon-gorgone-${{ matrix.operating_system }} (${{ matrix.platform }})
    env:
      GORGONE_IMAGE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}:${{ needs.dockerize-image.outputs.image_tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - name: Set up QEMU
        if: ${{ matrix.platform == 'linux/arm64' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Replace / with - in the platform name
        id: platform-name
        run: echo "dashed=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Pull image for ${{ matrix.platform }}
        run: docker pull --platform "${{ matrix.platform }}" "$GORGONE_IMAGE"
        shell: bash

      - name: Run boot test
        env:
          IMAGE: ${{ env.GORGONE_IMAGE }}
          PLATFORM: ${{ matrix.platform }}
        run: ./.github/scripts/gorgone-docker-boot-test.sh
        shell: bash

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: centreon-gorgone-boot-test-${{ matrix.operating_system }}-${{ steps.platform-name.outputs.dashed }}
          path: /tmp/gorgone-boot-test.log
          retention-days: 1

  docker-config-wiring-test:
    needs: [get-environment, dockerize-image]
    if: |
      ! cancelled() &&
      needs.get-environment.result == 'success' &&
      needs.dockerize-image.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
    name: docker config/wiring test centreon-gorgone-${{ matrix.operating_system }}
    env:
      GORGONE_IMAGE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}:${{ needs.dockerize-image.outputs.image_tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - name: Pull image
        run: docker pull --platform linux/amd64 "$GORGONE_IMAGE"
        shell: bash

      - name: Run config/wiring test scenarios
        env:
          IMAGE: ${{ env.GORGONE_IMAGE }}
        run: ./.github/scripts/gorgone-docker-config-wiring-test.sh
        shell: bash

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f .github/docker/centreon-gorgone/docker-compose.config-wiring-test.yml -p gorgone-config-wiring-test logs
        shell: bash

  promote-docker-tag:
    # Handles both mutually-exclusive cases produced by "Compute Docker tag":
    # the develop floating tag (additional_tag) and the deterministic
    # release/hotfix version tag (version_tag) — one job, one mechanism,
    # instead of two near-identical jobs. Only reached after
    # docker-boot-test/docker-config-wiring-test have both passed for this
    # exact image — promote-docker-to-ghcr looks up version_tag on the
    # eventual stable release (a separate, later run), so it must never point
    # at an image whose own container e2e tests failed.
    needs: [get-environment, dockerize-image, docker-boot-test, docker-config-wiring-test]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      (needs.dockerize-image.outputs.additional_tag != '' || needs.dockerize-image.outputs.version_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
    name: promote centreon-gorgone-${{ matrix.operating_system }} validated tag
    steps:
      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Promote validated tag (manifest retag, no rebuild)
        env:
          IMAGE_BASE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}
          SOURCE_TAG: ${{ needs.dockerize-image.outputs.image_tag }}
          TARGET_TAG: ${{ needs.dockerize-image.outputs.additional_tag || needs.dockerize-image.outputs.version_tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_BASE:$TARGET_TAG" \
            "$IMAGE_BASE:$SOURCE_TAG"
        shell: bash

  deliver-sources:
    runs-on: centreon-common
    needs: [get-environment, package]
    if: |
      github.event_name != 'workflow_dispatch' &&
      needs.get-environment.outputs.stability == 'stable' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.is_cloud == 'false'

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deliver sources
        uses: ./.github/actions/release-sources
        with:
          bucket_directory: centreon-gorgone
          module_directory: gorgone
          module_name: centreon-gorgone
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          token_download_centreon_com: ${{ secrets.TOKEN_DOWNLOAD_CENTREON_COM }}

  deliver-rpm:
    runs-on: ubuntu-24.04
    needs: [get-environment, unit-test-perl, robot-test, changes]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.changes.outputs.trigger_delivery == 'true' &&
      ((needs.get-environment.outputs.delivery_type == 'feature' && contains(github.event.pull_request.labels.*.name, 'delivery-feature')) ||
      contains(fromJson('["testing", "unstable"]'), needs.get-environment.outputs.stability)) &&
      (github.head_ref || github.ref_name) != 'MON-207622-provenance-attestation-sbom-ghcr' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')

    strategy:
      fail-fast: false
      matrix:
        distrib: [el9, el10]

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delivery
        uses: ./.github/actions/rpm-delivery
        with:
          module_name: gorgone
          distrib: ${{ matrix.distrib }}
          version: ${{ needs.get-environment.outputs.major_version }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
          delivery_type: ${{ needs.get-environment.outputs.delivery_type }}
          centreon_technique_pat: ${{ secrets.CENTREON_TECHNIQUE_PAT }}

  deliver-rpm-pulp:
    continue-on-error: true
    runs-on: centreon-ubuntu-22.04
    needs: [get-environment, unit-test-perl, robot-test, changes]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.changes.outputs.trigger_delivery == 'true' &&
      ((needs.get-environment.outputs.delivery_type == 'feature' && contains(github.event.pull_request.labels.*.name, 'delivery-feature')) ||
      contains(fromJson('["testing", "unstable"]'), needs.get-environment.outputs.stability)) &&
      (github.head_ref || github.ref_name) != 'MON-207622-provenance-attestation-sbom-ghcr' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')

    strategy:
      fail-fast: false
      matrix:
        distrib: [el9, el10]

    name: deliver ${{ matrix.distrib }} (pulp)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deliver packages on Pulp
        id: deliver_rpm_pulp
        uses: ./.github/actions/package-delivery-pulp
        continue-on-error: true
        with:
          module_name: gorgone
          distrib: ${{ matrix.distrib }}
          version: ${{ needs.get-environment.outputs.major_version }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
          delivery_type: ${{ needs.get-environment.outputs.delivery_type }}
          pulp_url: ${{ vars.PULP_API_URL }}
          pulp_content_url: ${{ vars.PULP_CONTENT_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}

      - name: Warn if the Pulp delivery failed
        if: steps.deliver_rpm_pulp.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Pulp delivery failed (non-blocking during the Artifactory-to-Pulp migration; Artifactory delivery remains authoritative). See the 'Deliver packages on Pulp' step for the guardrail / auth / upload error."

  deliver-deb:
    runs-on: ubuntu-24.04
    needs: [get-environment, unit-test-perl, robot-test, changes]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.changes.outputs.trigger_delivery == 'true' &&
      contains(fromJson('["unstable", "testing"]'), needs.get-environment.outputs.stability) &&
      (github.head_ref || github.ref_name) != 'MON-207622-provenance-attestation-sbom-ghcr' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      (needs.get-environment.outputs.is_cloud == 'false' || needs.get-environment.outputs.stability == 'unstable')

    strategy:
      fail-fast: false
      matrix:
        distrib: [trixie]  # No ubuntu in 24.10, 24.11 or later for now

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delivery
        uses: ./.github/actions/deb-delivery
        with:
          module_name: gorgone
          distrib: ${{ matrix.distrib }}
          version: ${{ needs.get-environment.outputs.major_version }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-deb-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}

  deliver-deb-pulp:
    continue-on-error: true
    runs-on: centreon-ubuntu-22.04
    needs: [get-environment, unit-test-perl, robot-test, changes]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.changes.outputs.trigger_delivery == 'true' &&
      contains(fromJson('["unstable", "testing"]'), needs.get-environment.outputs.stability) &&
      (github.head_ref || github.ref_name) != 'MON-207622-provenance-attestation-sbom-ghcr' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      (needs.get-environment.outputs.is_cloud == 'false' || needs.get-environment.outputs.stability == 'unstable')

    strategy:
      fail-fast: false
      matrix:
        distrib: [trixie]  # No ubuntu in 24.10, 24.11 or later for now

    name: deliver ${{ matrix.distrib }} (pulp)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deliver packages on Pulp
        id: deliver_deb_pulp
        uses: ./.github/actions/package-delivery-pulp
        continue-on-error: true
        with:
          module_name: gorgone
          distrib: ${{ matrix.distrib }}
          version: ${{ needs.get-environment.outputs.major_version }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-deb-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
          pulp_url: ${{ vars.PULP_API_URL }}
          pulp_content_url: ${{ vars.PULP_CONTENT_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}

      - name: Warn if the Pulp delivery failed
        if: steps.deliver_deb_pulp.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Pulp delivery failed (non-blocking during the Artifactory-to-Pulp migration; Artifactory delivery remains authoritative). See the 'Deliver packages on Pulp' step for the guardrail / auth / upload error."

  promote:
    needs: [get-environment, deliver-rpm, deliver-deb]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      (contains(fromJson('["stable"]'), needs.get-environment.outputs.stability) && github.event_name != 'workflow_dispatch') &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      github.repository == 'centreon/centreon-collect'

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distrib: [el9, el10, trixie]

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Promote ${{ matrix.distrib }} to stable
        uses: ./.github/actions/promote-to-stable
        with:
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          module_name: gorgone
          distrib: ${{ matrix.distrib }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          stability: ${{ needs.get-environment.outputs.stability }}
          github_ref_name: ${{ github.ref_name }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}

  promote-pulp:
    continue-on-error: true
    needs: [get-environment, deliver-rpm-pulp, deliver-deb-pulp]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      (contains(fromJson('["stable"]'), needs.get-environment.outputs.stability) && github.event_name != 'workflow_dispatch') &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      github.repository == 'centreon/centreon-collect'

    runs-on: centreon-ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        distrib: [el9, el10, trixie]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Promote ${{ matrix.distrib }} to stable on Pulp
        id: promote_pulp
        uses: ./.github/actions/promote-to-stable-pulp
        continue-on-error: true
        with:
          module_name: gorgone
          distrib: ${{ matrix.distrib }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
          pulp_url: ${{ vars.PULP_API_URL }}
          pulp_content_url: ${{ vars.PULP_CONTENT_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}

      - name: Warn if the Pulp promotion failed
        if: steps.promote_pulp.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Pulp promotion failed (non-blocking during the Artifactory-to-Pulp migration; Artifactory promotion remains authoritative). See the 'Promote to stable on Pulp' step."

  promote-docker-to-ghcr:
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.stability == 'stable' &&
      (github.event_name != 'workflow_dispatch' || (github.head_ref || github.ref_name) == 'MON-207622-provenance-attestation-sbom-ghcr') &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      github.repository == 'centreon/centreon-collect'
    runs-on: centreon-ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        operating_system: [trixie]
    name: promote centreon-gorgone-${{ matrix.operating_system }} to ghcr.io stable
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Harbor registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Promote to ghcr.io stable (best-effort, non-blocking)
        # Fails hard if no Harbor candidate is found under the deterministic
        # version_tag from dockerize-image (only produced after robot-test
        # passed) or if the ghcr.io push itself fails — continue-on-error
        # swallows that into a warning below, mirroring how
        # promote-to-stable-pulp is called. Deliberately no fallback to the
        # legacy release_type-based tag: that tag is written at build time,
        # before container e2e tests run, so it's never a validated candidate.
        continue-on-error: true
        id: promote-ghcr
        uses: ./.github/actions/promote-docker-to-ghcr
        with:
          ghcr_image: ghcr.io/centreon/centreon-gorgone
          harbor_image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-gorgone-${{ matrix.operating_system }}
          harbor_tag: ${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}
          ghcr_tags: ${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }} ${{ needs.get-environment.outputs.major_version }}
          platforms: linux/amd64,linux/arm64

      - name: Warn if ghcr.io stable delivery failed
        if: steps.promote-ghcr.outcome == 'failure'
        run: |
          echo "::warning::ghcr.io delivery failed for centreon-gorgone-${{ matrix.operating_system }}. This release is available on Harbor but was NOT published to ghcr.io — see the 'Promote to ghcr.io stable' step for the missing-candidate or push error, and investigate before relying on public delivery for this version."
        shell: bash

      - name: Attest SBOM on ghcr.io (best-effort, non-blocking)
        if: steps.promote-ghcr.outcome == 'success' && steps.promote-ghcr.outputs.digest != ''
        continue-on-error: true
        id: attest-ghcr
        uses: ./.github/actions/attest-ghcr-image
        with:
          ghcr_image: ghcr.io/centreon/centreon-gorgone
          digest: ${{ steps.promote-ghcr.outputs.digest }}
          amd64_digest: ${{ steps.promote-ghcr.outputs.amd64_digest }}

      - name: Warn if ghcr.io attestation failed
        if: steps.attest-ghcr.outcome == 'failure'
        run: |
          echo "::warning::SBOM attestation failed for centreon-gorgone-${{ matrix.operating_system }}. The image WAS published to ghcr.io but is unattested — see the 'Attest SBOM on ghcr.io' step and investigate before relying on gh attestation verify for this version."
        shell: bash

  set-skip-label:
    needs: [get-environment, deliver-rpm, deliver-deb, promote]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/set-pull-request-skip-label.yml
