# Minimal centengine.cfg for e2e runtime tests.
#
# centreon-engine does not boot into a useful "default" state on its own -
# out of the box (no volumes mounted) it crash-loops until a real
# configuration is pushed from a Centreon Central, which is by design (see
# .github/scripts/centreon-engine-docker-*-test.sh for why every test
# scenario mounts this fixture over /etc/centreon-engine). This is a
# deliberately minimal but real, working configuration - one host, one
# service, one command - derived from a live poller's exported config, with
# the OpenTelemetry/CMA broker module dropped (it needs TLS certs unrelated
# to what these tests cover) and the monitoring broker output emptied (no
# central is reachable from CI, and cbmod connects lazily/retries in the
# background rather than requiring it at startup - verified locally before
# committing this fixture).
cfg_file=/etc/centreon-engine/hostTemplates.cfg
cfg_file=/etc/centreon-engine/hosts.cfg
cfg_file=/etc/centreon-engine/serviceTemplates.cfg
cfg_file=/etc/centreon-engine/services.cfg
cfg_file=/etc/centreon-engine/commands.cfg
cfg_file=/etc/centreon-engine/contactgroups.cfg
cfg_file=/etc/centreon-engine/contacts.cfg
cfg_file=/etc/centreon-engine/hostgroups.cfg
cfg_file=/etc/centreon-engine/servicegroups.cfg
cfg_file=/etc/centreon-engine/timeperiods.cfg
cfg_file=/etc/centreon-engine/escalations.cfg
cfg_file=/etc/centreon-engine/dependencies.cfg
cfg_file=/etc/centreon-engine/connectors.cfg
cfg_file=/etc/centreon-engine/meta_commands.cfg
cfg_file=/etc/centreon-engine/meta_timeperiod.cfg
cfg_file=/etc/centreon-engine/meta_host.cfg
cfg_file=/etc/centreon-engine/meta_services.cfg
cfg_file=/etc/centreon-engine/tags.cfg
cfg_file=/etc/centreon-engine/severities.cfg
broker_module=/usr/lib64/centreon-engine/externalcmd.so
broker_module=/usr/lib64/nagios/cbmod.so /etc/centreon-broker/my-poller-module.json
broker_module_cfg_file=/etc/centreon-broker/my-poller-module.json
interval_length=60
resource_file=/etc/centreon-engine/resource.cfg
log_file=
status_file=/var/log/centreon-engine/status.dat
status_update_interval=60
external_command_buffer_slots=4096
command_check_interval=1s
command_file=/var/lib/centreon-engine/rw/centengine.cmd
state_retention_file=/var/log/centreon-engine/retention.dat
retention_update_interval=60
sleep_time=0.5
max_concurrent_checks=0
max_service_check_spread=15
max_host_check_spread=15
check_result_reaper_frequency=5
low_service_flap_threshold=25.0
high_service_flap_threshold=50.0
low_host_flap_threshold=25.0
high_host_flap_threshold=50.0
service_check_timeout=60
host_check_timeout=30
event_handler_timeout=30
notification_timeout=30
date_format=euro
illegal_object_name_chars=~!$%^&*"|'<>?,()=
illegal_macro_output_chars=`~$^&"|'<>
admin_email=admin@localhost
admin_pager=admin@localhost
event_broker_options=-1
cached_host_check_horizon=15
cached_service_check_horizon=15
additional_freshness_latency=15
debug_level=0
debug_verbosity=1
log_pid=1
enable_macros_filter=0
grpc_port=50155
rpc_listen_address=0.0.0.0
log_v2_enabled=1
log_legacy_enabled=0
log_v2_logger=file
log_level_functions=err
log_level_config=info
log_level_events=info
log_level_checks=info
log_level_notifications=err
log_level_eventbroker=err
log_level_external_command=info
log_level_commands=err
log_level_downtimes=err
log_level_comments=err
log_level_macros=err
log_level_process=info
log_level_runtime=err
instance_heartbeat_interval=30
enable_notifications=1
execute_service_checks=1
accept_passive_service_checks=1
execute_host_checks=1
accept_passive_host_checks=1
enable_event_handlers=1
check_external_commands=1
use_retained_program_state=1
use_retained_scheduling_info=0
use_syslog=0
log_notifications=1
log_service_retries=1
log_host_retries=1
log_event_handlers=1
log_external_commands=1
log_passive_checks=1
auto_reschedule_checks=0
soft_state_dependencies=0
check_for_orphaned_services=1
check_for_orphaned_hosts=1
check_service_freshness=0
check_host_freshness=0
enable_flap_detection=1
use_regexp_matching=0
use_true_regexp_matching=0
enable_predictive_host_dependency_checks=1
enable_predictive_service_dependency_checks=1
host_down_disable_service_checks=0
