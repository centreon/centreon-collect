name: Central-docker
description: >
  Central orchestrator gorgone configuration for the split httpd/php-fpm Docker
  topology (Pilier 2, config-delivery). Standalone file, NOT part of config.d/ —
  loaded directly via `gorgoned --config=/etc/centreon-gorgone/40-gorgoned-central.yaml`
  so it never merges with the poller-oriented config.d/40-gorgoned.yaml baked into
  this same image (see .github/docker/centreon-gorgone/trixie/Dockerfile).
configuration:
  centreon:
    database:
      # Placeholder values — overridden at runtime via
      # GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__{DSN,USERNAME,PASSWORD} and
      # the DB_REALTIME siblings (gorgone::class::script::load_env_config).
      db_configuration:
        dsn: "mysql:host=mariadb;dbname=centreon"
        username: centreon
        password: centreon
      db_realtime:
        dsn: "mysql:host=mariadb;dbname=centreon_storage"
        username: centreon
        password: centreon
  gorgone:
    gorgonecore:
      # Deliberately NOT the Central poller's own nagios_server.id (normally 1).
      # gorgone::class::core.pm:649-654 nulls any dispatch target equal to this id,
      # bypassing the proxy module entirely — which would silently break REMOTECOPY/
      # COMMAND to poller id 1 (see plan fact #1/#11 — "gorgonecore.id collision").
      id: 1000
      privkey: /var/lib/centreon-gorgone/.keys/rsakey.priv.pem
      pubkey: /var/lib/centreon-gorgone/.keys/rsakey.pub.pem

    modules:
      - name: httpserver
        package: gorgone::modules::core::httpserver::hooks
        enable: true
        address: 0.0.0.0
        port: 8443
        ssl: false
        auth:
          enabled: true
          user: admin
          password: password
        allowed_hosts:
          enabled: true
          subnets:
            # Docker default bridge + compose-network ranges. Placeholder — must be
            # adjusted to cover php-fpm's actual compose network once known (open
            # question in the plan: exact subnet from centreon-web-split's compose).
            - 127.0.0.1/32
            - 172.16.0.0/12

      - name: proxy
        package: gorgone::modules::core::proxy::hooks
        enable: true

      # Registers the /core/action/command and /core/action/engine HTTP routes on
      # A's own httpserver (gorgone::modules::core::httpserverng::class only exposes
      # routes for modules loaded in THIS process — the actual whitelist check and
      # shell-exec happen on the receiving node, here process B, which already gets
      # this module + the real whitelist via config.yaml/config.d in its own,
      # unmodified poller config). Needed for the RELOAD/RESTART API migration
      # (restartPollers.php) — see plan "Portée du changement PHP".
      - name: action
        package: gorgone::modules::core::action::hooks
        enable: true
        command_timeout: 30
        whitelist_cmds: true
        allowed_cmds: !include /etc/centreon-gorgone/config.d/whitelist.conf.d/*.yaml

      # DB-driven sync registers the Central-as-a-poller row (id 1) like any
      # other poller in this split-container topology — no manual `register`
      # module needed (matches the native TYPE=central entrypoint, which
      # never had one).
      - name: nodes
        package: gorgone::modules::centreon::nodes::hooks
        enable: true

      # Kept enabled: still the only path for the 14 non-migrated centcore
      # commands (SENDEXPORTFILE, SYNCTRAP, RESTARTCENTREONTRAPD, STARTWORKER,
      # VMWARERESTART, EXTERNALCMD, ...). Only SENDCFGFILE (moveFiles.php) and
      # RELOAD/RESTART (restartPollers.php) are meant to bypass this via direct
      # API calls — see plan "Portée du changement PHP".
      - name: legacycmd
        package: gorgone::modules::centreon::legacycmd::hooks
        enable: true
        cmd_file: "/var/lib/centreon/centcore.cmd"
        cache_dir: "/var/cache/centreon/"
        cache_dir_trap: "/etc/snmp/centreon_traps/"
        remote_dir: "/var/cache/centreon/config/remote-data/"
