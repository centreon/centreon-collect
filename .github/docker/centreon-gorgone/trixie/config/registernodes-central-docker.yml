# Manual node registration for the "Central-as-a-poller" gorgone process (Process
# B in the plan). id must equal Central's own nagios_server.id (normally 1) —
# that's what moveFiles.php/restartPollers.php target via SENDCFGFILE/RELOAD/RESTART.
#
# prevail: 1 is required, not cosmetic: it protects this manual entry from being
# torn down by UNREGISTERNODESFROMCENTRAL, which the `nodes` (DB sync) module
# would otherwise send for id 1 on every resync — action_centreonnodessync always
# treats the localhost=1 row as $core_id, never as a register_nodes entry, so
# without prevail a resync could delete this entry it never created.
nodes:
  - id: 1
    type: push_zmq
    address: gorgone-central-poller
    port: 5556
    prevail: 1
