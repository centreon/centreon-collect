# Central-as-a-poller fixture (Pilier 2, config-delivery for the split httpd/php-fpm
# web). Two gorgone processes:
#   - gorgone-central (process A): TYPE=central, hosts httpserver+proxy+register+
#     nodes+legacycmd. Shares /var/cache/centreon and /var/lib/centreon with php-fpm
#     in the real deployment (this fixture keeps them as plain named volumes, since
#     there is no php-fpm container here — see the plan doc for how to join the
#     centreon-web-split stack for a real end-to-end run).
#   - gorgone-central-poller (process B): the EXISTING, unmodified TYPE=poller image/
#     config, reused as-is. Represents Central's own engine acting as a poller for
#     config-delivery purposes.
#
# Empirically validated end-to-end (manual curl, see plan doc "Séquence de test
# empirique"): REMOTECOPY (config delivery) and COMMAND (reload/restart, gated by
# the same whitelist as a real poller) both work through this topology.
#
# Known open point automated here: push_zmq requires B to statically list A's
# pubkey thumbprint in `authorized_clients` (gorgone/gorgone/standard/library.pm:244-256
# — no TOFU on the server side, unlike the client side's fingerprint_mode:first).
# `central-trust-init` computes A's thumbprint from its persisted keypair and writes
# it for B to mount — this is what had to be done by hand during investigation.
services:
  # Throwaway DB for this fixture only — no real Centreon schema, so `nodes`/
  # `legacycmd`'s DB-backed lookups (poller list, cfg_dir, engine_reload_command)
  # log harmless "table doesn't exist" errors here. That's fine: the manual
  # `register` entry (registernodes-central-docker.yml) doesn't need the schema,
  # and neither does REMOTECOPY/COMMAND dispatch once a node is registered. A real
  # end-to-end run needs the actual centreon-web-split stack's DB instead — see the
  # plan doc's step 6.
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: centreon
      MARIADB_USER: centreon
      MARIADB_PASSWORD: centreon
    volumes:
      - ./central-poller-e2e-initdb.sql:/docker-entrypoint-initdb.d/central-poller-e2e-initdb.sql:ro

  gorgone-central:
    image: ${GORGONE_IMAGE}
    command: ["/usr/bin/perl", "/usr/bin/gorgoned",
              "--config=/etc/centreon-gorgone/40-gorgoned-central.yaml",
              "--severity=debug", "--flushoutput"]
    environment:
      TYPE: central
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__DSN: "mysql:host=mariadb;dbname=centreon"
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__USERNAME: centreon
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__PASSWORD: centreon
      GORGONE__CENTREON__DATABASE__DB_REALTIME__DSN: "mysql:host=mariadb;dbname=centreon_storage"
      GORGONE__CENTREON__DATABASE__DB_REALTIME__USERNAME: centreon
      GORGONE__CENTREON__DATABASE__DB_REALTIME__PASSWORD: centreon
    volumes:
      - central-keys:/var/lib/centreon-gorgone/.keys
      - centreon-cache:/var/cache/centreon      # shared with php-fpm in the real deployment
      - centreon-varlib:/var/lib/centreon        # shared with php-fpm in the real deployment (centcore.cmd)

  # Computes gorgone-central's pubkey JWK thumbprint and writes it as a config.d
  # snippet for the poller to mount — automates the manual step done during
  # investigation (`perl -MCrypt::PK::RSA -E '...->export_key_jwk_thumbprint(...)'`).
  # Polls because key generation on gorgone-central's first boot is asynchronous.
  central-trust-init:
    image: ${GORGONE_IMAGE}
    user: root
    entrypoint: ["perl", "-MCrypt::PK::RSA", "-E"]
    command:
      - >
        my $$path = "/keys/rsakey.pub.pem";
        until (-s $$path) { sleep 1; }
        my $$tp = Crypt::PK::RSA->new($$path)->export_key_jwk_thumbprint("SHA256");
        open(my $$fh, ">", "/trust/41-central-trust.yaml") or die $$!;
        print $$fh "gorgone:\n  gorgonecore:\n    authorized_clients:\n      - key: $$tp\n";
        close($$fh);
        print "central-trust-init: wrote authorized_clients for thumbprint $$tp\n";
    volumes:
      - central-keys:/keys:ro
      - ./central-poller-e2e-trust:/trust
    depends_on:
      - gorgone-central

  gorgone-central-poller:
    image: ${GORGONE_IMAGE}
    environment:
      TYPE: poller
      APP_SECRET: e2e-test-secret
      SALT: e2e-test-salt
      # Must equal the real nagios_server.id of Central (normally 1) — that's what
      # moveFiles.php/restartPollers.php target via SENDCFGFILE/RELOAD/RESTART.
      GORGONE_UID: "1"
      GORGONE__GORGONE__GORGONECORE__EXTERNAL_COM_TYPE: tcp
      GORGONE__GORGONE__GORGONECORE__EXTERNAL_COM_PATH: "*:5556"
    volumes:
      - engine-context:/etc/centreon-engine
      - broker-context:/etc/centreon-broker
      # A single bind-mounted FILE landing directly under config.d/ — config.yaml's
      # `!include config.d/*.yaml` is a flat glob, it does not recurse into
      # subdirectories, so this must not be mounted as a subdirectory (a named
      # volume mounted at a config.d subpath was tried and silently ignored by the
      # include).
      - ./central-poller-e2e-trust/41-central-trust.yaml:/etc/centreon-gorgone/config.d/41-central-trust.yaml:ro
    depends_on:
      central-trust-init:
        # Plain `depends_on` only waits for the container to START, not finish —
        # gorgone-central-poller would then boot and read its config.d/*.yaml
        # BEFORE central-trust-init's async key-polling loop had actually written
        # the trust file, silently keeping the old/empty authorized_clients (gorgone
        # config is read once at boot, no hot-reload). Confirmed by hitting exactly
        # this race empirically. `service_completed_successfully` blocks until the
        # init script has actually exited 0.
        condition: service_completed_successfully
      engine-context-init:
        condition: service_completed_successfully

  # Reproduces the minimal precondition normally set by a real centengine image
  # shipping /etc/centreon-engine group-writable — see docker-compose.config-wiring-test.yml
  # for the identical, already-tested pattern this mirrors.
  engine-context-init:
    image: ${GORGONE_IMAGE}
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /etc/centreon-engine && chown centreon-engine:centreon-engine /etc/centreon-engine && chmod 775 /etc/centreon-engine"
    volumes:
      - engine-context:/etc/centreon-engine

volumes:
  central-keys:
  centreon-cache:
  centreon-varlib:
  engine-context:
  broker-context:
