# Central-as-a-poller fixture, pullwss variant — uses the NATIVE TYPE=central
# entrypoint (container.d/12-central-config.sh writing config.d/*.yaml), same
# code path as k8s/docker-web-split production deployments. Does not use
# `gorgoned --config=` against a static file anymore (see
# docker-compose.central-poller-e2e.yml, push_zmq, for that older approach,
# kept as the fallback prototype).
#
# NOT self-contained by design: pullwss's whole point is going through httpd
# for TLS termination, so this joins the EXTERNAL network of the
# `centreon-web-split` stack (repo `centreon`, .github/docker/centreon-web-split/docker-compose.yml)
# rather than standing up its own httpd.
#
# Usage (after `centreon-web-split` is already up, and its httpd was started/recreated with
# GORGONE_WSS_UPSTREAM=gorgone-central:8087 — see the plan doc for the exact recreate command):
#   docker compose -f docker-compose.central-poller-pullwss-e2e.yml -p central-pullwss-e2e up -d
services:
  gorgone-central:
    image: ${GORGONE_IMAGE}
    networks:
      default:
        aliases:
          - gorgone-central
    environment:
      TYPE: central
      # gorgone's own login to the Centreon API (centreonv2/clapi tpapi) — same
      # dev-only seed credential documented in the Pilier-1 README, not a secret.
      CENTREON_API_BASE_URL: "http://httpd/centreon/api/latest/"
      CENTREON_API_USERNAME: admin
      CENTREON_API_PASSWORD: "Centreon!2021"
      # Point at the web-split stack's real DB (service name from that stack's compose project).
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__DSN: "mysql:host=centreon-web-split-db-1;dbname=centreon"
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__USERNAME: centreon
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__PASSWORD: centreon
      GORGONE__CENTREON__DATABASE__DB_REALTIME__DSN: "mysql:host=centreon-web-split-db-1;dbname=centreon_storage"
      GORGONE__CENTREON__DATABASE__DB_REALTIME__USERNAME: centreon
      GORGONE__CENTREON__DATABASE__DB_REALTIME__PASSWORD: centreon
    volumes:
      - centreon-cache:/var/cache/centreon      # shared with php-fpm in the real deployment
      - centreon-varlib:/var/lib/centreon        # shared with php-fpm in the real deployment (centcore.cmd)

  gorgone-central-poller:
    image: ${GORGONE_IMAGE}
    environment:
      TYPE: poller
      APP_SECRET: e2e-test-secret
      SALT: e2e-test-salt
      # Must equal the real nagios_server.id of Central (normally 1).
      GORGONE_UID: "1"
      CENTRAL_HOST: httpd
      CENTRAL_PORT: "80"
      # Self-fetches a real Centreon API token instead of a static shared
      # secret (container.d/13-pullwss-token-fetch.sh) — matches how gorgone-central
      # validates it: a name:value token goes through the real tpapi_centreonv2
      # lookup (gorgone-central's own login above), not a static comparison.
      # "poller-default" is auto-created by Centreon's install process —
      # verify it exists in the joined stack's DB before relying on it.
      PULLWSS_TOKEN_NAME: poller-default
      CENTREON_API_BASE_URL: "http://httpd/centreon/api/latest/"
      CENTREON_API_USERNAME: admin
      CENTREON_API_PASSWORD: "Centreon!2021"
      # This dev stack's httpd has no TLS configured (port 80 only) — production talks wss:// to
      # httpd's real HTTPS port instead, no override needed there.
      GORGONE__GORGONE__MODULES__pullwss__ssl: "false"
    volumes:
      - engine-context:/etc/centreon-engine
      - broker-context:/etc/centreon-broker

  engine-context-init:
    image: ${GORGONE_IMAGE}
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /etc/centreon-engine && chown centreon-engine:centreon-engine /etc/centreon-engine && chmod 775 /etc/centreon-engine"
    volumes:
      - engine-context:/etc/centreon-engine

networks:
  default:
    name: centreon-web-split_default
    external: true

volumes:
  centreon-cache:
  centreon-varlib:
  engine-context:
  broker-context:
