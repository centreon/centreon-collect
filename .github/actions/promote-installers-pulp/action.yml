name: "promote-installers-pulp"
description: "Promote a standalone installer from testing to stable in the pulp installers repositories"
inputs:
  module_name:
    description: "The installer module name (the installers/<module> path segment)"
    required: true
  major_version:
    description: "Centreon packaged major version"
    required: true
  installer_name:
    description: "Published file name, versioned (e.g. centreon-monitoring-agent-25.10.9.exe)"
    required: true
  release_type:
    description: "Type of release (release, hotfix) - selects the split testing tier"
    required: false
    default: ""
  installer_os:
    description: "The os segment of the relative path inside the repository"
    required: false
    default: "windows"
  pulp_url:
    description: "The pulp server api url"
    required: true
  pulp_content_url:
    description: "The pulp server content url"
    required: true
  audience:
    description: "OIDC audience, must match the pulp server GITHUB_OIDC.audience"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup pulp-cli
      uses: ./.github/actions/setup-pulp-cli
      with:
        pulp_url: ${{ inputs.pulp_url }}
        audience: ${{ inputs.audience }}
        domain: default

    - name: Promote the installer to stable
      shell: bash
      env:
        MODULE_NAME: ${{ inputs.module_name }}
        MAJOR_VERSION: ${{ inputs.major_version }}
        INSTALLER_NAME: ${{ inputs.installer_name }}
        INSTALLER_OS: ${{ inputs.installer_os }}
        RELEASE_TYPE: ${{ inputs.release_type }}
        PULP_URL: ${{ inputs.pulp_url }}
        PULP_CONTENT_URL: ${{ inputs.pulp_content_url }}
        PULP_TOKEN: ${{ env.PULP_TOKEN }}
      run: ${{ github.action_path }}/promote-installers.sh
