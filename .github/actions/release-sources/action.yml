name: "release-sources"
description: "Release sources on download.centreon.com"
inputs:
  bucket_directory:
    description: The bucket directory
    required: true
  module_directory:
    description: The module directory
    required: true
  module_name:
    description: The module name
    required: true
  major_version:
    description: The major version
    required: true
  minor_version:
    description: The minor version
    required: true
  token_download_centreon_com:
    description: The token to call download.centreon.com api
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup awscli
      run: |
        if ! command -v aws >/dev/null 2>&1; then
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          sudo unzip -q awscliv2.zip
          sudo ./aws/install
        fi
      shell: bash

    - env:
        MAJOR_VERSION: ${{ inputs.major_version }}
        MINOR_VERSION: ${{ inputs.minor_version }}
        MODULE_NAME: ${{ inputs.module_name }}
        MODULE_DIRECTORY: ${{ inputs.module_directory }}
        BUCKET_DIRECTORY: ${{ inputs.bucket_directory }}
        TOKEN_DOWNLOAD_CENTREON_COM: ${{ inputs.token_download_centreon_com }}
      run: |
        VERSION="$MAJOR_VERSION.$MINOR_VERSION"
        SRC_FILE="$MODULE_NAME-$VERSION.tar.gz"

        mv "$MODULE_DIRECTORY" "$MODULE_NAME-$VERSION"
        tar czf "$SRC_FILE" "$MODULE_NAME-$VERSION"

        SRC_HASH=$(md5sum "$SRC_FILE" | cut -d ' ' -f 1)
        SRC_SIZE=$(stat -c '%s' "$SRC_FILE")

        aws s3 cp --acl public-read "$SRC_FILE" "s3://centreon-download/public/$BUCKET_DIRECTORY/$SRC_FILE"
        curl --fail "https://download.centreon.com/api/?token=$TOKEN_DOWNLOAD_CENTREON_COM&product=$MODULE_NAME&release=$MAJOR_VERSION&version=$VERSION&extension=tar.gz&md5=$SRC_HASH&size=$SRC_SIZE&ddos=0&dryrun=0"
      shell: bash
