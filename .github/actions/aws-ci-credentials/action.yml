name: AWS CI credentials
description: Assume an AWS role with the GitHub OIDC token of the job, when the job can request one.

inputs:
  role_arn:
    description: ARN of the role to assume (output aws_ci_role_arn of get-environment.yml).
    required: true

outputs:
  available:
    description: "'true' when AWS credentials are exported to the next steps of the job."
    value: ${{ steps.assume.outcome == 'success' }}

runs:
  using: composite
  steps:
    - name: Check the OIDC token request context
      id: oidc
      shell: bash
      run: |
        # Pull requests from forks get no OIDC token: the job then runs without AWS credentials.
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No OIDC token request context (fork pull request, or no 'id-token: write' permission): no AWS credentials"
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Assume the AWS role
      id: assume
      if: steps.oidc.outputs.available == 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: eu-west-1
        # OIDC credentials are not refreshed: cover the longest build job (role max session = 3 h).
        role-duration-seconds: 10800
