name: Detect changes and generate changelog
description: >
  Detect changed components using git diff between two SHAs,
  apply special rules, and generate a changelog.

inputs:
  base_sha:
    description: Base commit SHA (e.g. previous stable tag commit)
    required: true
  base_ref:
    description: Base ref name (e.g. tag name, for git-chglog --from)
    required: true
  head_sha:
    description: Head commit SHA (e.g. new release branch head)
    required: true

outputs:
  components_json:
    description: JSON array of changed components
    value: ${{ steps.export.outputs.components_json }}

runs:
  using: composite
  steps:
    - name: Ensure full git history and tags
      shell: bash
      run: |
        git fetch --all --tags --prune
        git fetch --unshallow || true

    - name: Compute changed files
      shell: bash
      run: |
        git diff --name-only "${{ inputs.base_sha }}" "${{ inputs.head_sha }}" \
          > changed_files.txt

    - name: Compute directory-based components
      shell: bash
      run: |
        awk -F/ '{print $1}' changed_files.txt \
          | grep -v '^\.' \
          | sort -u \
          > components.txt

    # Special usecase for collect
    - name: Apply special component rules
      shell: bash
      run: |
        SPECIAL=()

        grep -q '^packaging/' changed_files.txt && SPECIAL+=("release-bundle")
        grep -qE '^(\.github/|ci/)' changed_files.txt && SPECIAL+=("infrastructure")
        grep -qE '^(VERSION|Makefile)$' changed_files.txt && SPECIAL+=("global")

        {
          cat components.txt
          printf "%s\n" "${SPECIAL[@]}"
        } | sort -u > final_components.txt

    - name: Install git-chglog
      shell: bash
      run: |
        curl -sSL \
          https://github.com/git-chglog/git-chglog/releases/latest/download/git-chglog_linux_amd64.tar.gz \
          | tar -xz
        mv git-chglog /usr/local/bin/

    - name: Generate changelog
      shell: bash
      run: |
        git-chglog \
          --from "${{ inputs.base_ref }}" \
          --to   "${{ inputs.head_sha }}" \
          --output CHANGELOG.generated.md

    - name: Export components as JSON
      id: export
      shell: bash
      run: |
        COMPONENTS_JSON=$(jq -R -s -c 'split("\n")[:-1]' final_components.txt)
        echo "components_json=$COMPONENTS_JSON" >> "$GITHUB_OUTPUT"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-diff-artifacts
        path: |
          changed_files.txt
          final_components.txt
          CHANGELOG.generated.md
