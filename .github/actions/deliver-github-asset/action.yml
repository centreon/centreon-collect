name: "deliver-github-asset"
description: "Deliver CMA assets from the Pulp stable repositories to a GitHub release"
inputs:
  github_release:
    description: "Target GitHub release tag (e.g. centreon-monitoring-agent-27.08.3)"
    required: true
  version:
    description: "CMA version to fetch from Pulp (e.g. 27.08.3)"
    required: true
  distrib:
    description: "Comma-separated distros to fetch (default: all)"
    required: false
  strict:
    description: "Fail when a distrib or the windows installer is missing from Pulp stable"
    required: false
    default: "false"
  dry_run:
    description: "Dry run — log actions without executing"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Deliver CMA assets
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DELIVER_GITHUB_RELEASE: ${{ inputs.github_release }}
        DELIVER_VERSION: ${{ inputs.version }}
        DELIVER_DISTRIB: ${{ inputs.distrib }}
        DELIVER_REPO: ${{ github.repository }}
        DELIVER_DRY_RUN: ${{ inputs.dry_run }}
        DELIVER_STRICT: ${{ inputs.strict }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../scripts/deliver-cma-assets.sh"
