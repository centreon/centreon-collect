syntax = "proto3";


package com.centreon.connector.perl;

message GlobalError {
    string error = 1;
}


message Execute {
    uint64 cmd_id = 1;
    repeated string args = 2; // command arguments without script path
    bool no_child_create = 3; //if true and all child_script are running, we does not create a new child_script
    int64 timeout = 4;
    uint32 max_execute = 5; //max number of script execute, after this threshold kill child_script
    uint32 percent_max_memory_increased = 6;
    uint32 percent_max_open_fd_increased = 7;
    uint32 max_thread = 8;
}


message CheckChildStatistics {
    uint64 used_memory = 1;
    uint32 nb_opened_fd = 2;
    uint32 nb_thread = 3;
}

message Result {
    uint64 cmd_id = 1;
    int64 pid = 2;
    int32 status = 3;
    string stdout = 4;
    string stderr = 5;
    CheckChildStatistics after_first_check = 6;
    CheckChildStatistics after_last_check = 7;
}


message Terminate {
    int64 pid = 1;
    bool immediate = 2;
    //used when we need to erase a check child in order to save memory
    //in that case script child iterate this list and kill first idle check child of list
    repeated int64 other_pids = 3; 
}

message CheckChildEnd {
    int64 pid = 1;
}

message ConnectorMess {
    oneof content {
        GlobalError have_to_terminate = 1;
        Execute execute = 2;
        Result result = 3;
        Terminate terminate = 4;
        CheckChildEnd child_end = 5;
    }
}
