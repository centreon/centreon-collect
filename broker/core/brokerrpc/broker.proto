syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "process_stat.proto";
import "common.proto";
import "neb.proto";

package com.centreon.broker;

service Broker {
  rpc GetVersion(google.protobuf.Empty) returns (Version) {}

  // stats
  rpc GetProcessStats(google.protobuf.Empty)
      returns (com.centreon.common.pb_process_stat) {}
  rpc GetGenericStats(google.protobuf.Empty) returns (GenericString) {}
  rpc SetSqlManagerStats(SqlManagerStatsOptions)
      returns (google.protobuf.Empty) {}
  rpc GetSqlManagerStats(SqlConnection) returns (SqlManagerStats) {}
  rpc GetConflictManagerStats(google.protobuf.Empty)
      returns (ConflictManagerStats) {}
  rpc GetMuxerStats(GenericString) returns (MuxerStats) {}

  rpc GetNumModules(google.protobuf.Empty) returns (GenericSize) {}
  rpc GetModulesStats(GenericNameOrIndex) returns (GenericString) {}

  rpc GetNumEndpoint(google.protobuf.Empty) returns (GenericSize) {}
  rpc GetEndpointStats(GenericNameOrIndex) returns (GenericString) {}

  rpc GetProcessingStats(google.protobuf.Empty) returns (ProcessingStats) {}

  /**
   * @brief Rebuild RRD metric from data in the SQL database.
   *
   * @param IndexIds Message containing a vector of metric ids.
   *
   * @return An Empty object.
   */
  rpc RebuildRRDGraphs(IndexIds) returns (google.protobuf.Empty) {}

  /**
   * @brief Build a file with the BA content and relations.
   *
   * @param BaInfo Message containing the BA ID and the output file to fill
   * (currently this file is a *.dot file)
   *
   * @return An Empty object.
   */
  rpc GetBa(BaInfo) returns (google.protobuf.Empty) {}

  /**
   * @brief Remove RRD files from index IDs.
   *
   * @param ToRemove Message containing a vector of metric ids and index ids.
   *
   * @return An Empty object.
   */
  rpc RemoveGraphs(ToRemove) returns (google.protobuf.Empty) {}

  /**
   * @brief Remove a poller configuration from Broker and real time database.
   *
   * @param GenericNameOrIndex Message containing the poller name or its id.
   *
   * @return An Empty object.
   */
  rpc RemovePoller(GenericNameOrIndex) returns (google.protobuf.Empty) {}

  /**
   * @brief Retrieve some informations about loggers. If a name is specified,
   * Informations are concentrated on the logger of that name.
   *
   * @param A logger name.
   *
   * @return A LogInfo message.
   */
  rpc GetLogInfo(GenericString) returns (LogInfo) {}

  /**
   * @brief Set level of a logger.
   *
   * @param A message with a logger and a level as strings.
   *
   * @return nothing.
   */
  rpc SetLogLevel(LogLevel) returns (google.protobuf.Empty) {}

  /**
   * @brief Set log flush period of all loggers.
   *
   * @param period in second, 0 means flush all the times
   *
   * @return nothing.
   */
  rpc SetLogFlushPeriod(LogFlushPeriod) returns (google.protobuf.Empty) {}
  rpc Aes256Encrypt(AesMessage) returns (GenericString) {}
  rpc Aes256Decrypt(AesMessage) returns (GenericString) {}

  rpc GetPeers(google.protobuf.Empty) returns (PeerList) {}
  rpc GetPollers(google.protobuf.Empty) returns (PeerList) {}
  rpc GetHostIds(google.protobuf.Empty) returns (IdsList) {}
  rpc GetHost(GenericNameOrIndex) returns (Host) {}
  rpc GetServiceIds(google.protobuf.Empty) returns (IdsPairsList) {}
  rpc GetService(ServiceIdentifier) returns (Service) {}

  /**
   * @brief Return the IDs of all hostgroups currently in the broker cache.
   *
   * @return An IdsList with the hostgroup IDs.
   */
  rpc GetHostGroupIds(google.protobuf.Empty) returns (IdsList) {}

  /**
   * @brief Return the HostGroup object with its member host IDs for the given
   * name or ID from the broker cache. The member_host_ids field of the
   * returned HostGroup is populated with the IDs of all member hosts.
   *
   * @param GenericNameOrIndex Use str for name-based lookup, idx for ID-based.
   *
   * @return The HostGroup message with member_host_ids populated.
   */
  rpc GetHostGroup(GenericNameOrIndex) returns (HostGroup) {}

  /**
   * @brief Return the IDs of all servicegroups currently in the broker cache.
   *
   * @return An IdsList with the servicegroup IDs.
   */
  rpc GetServiceGroupIds(google.protobuf.Empty) returns (IdsList) {}

  /**
   * @brief Return the ServiceGroup object with its member (host_id, service_id)
   * pairs for the given ID from the broker cache. The member_service_ids field
   * of the returned ServiceGroup is populated with the member service pairs.
   *
   * @param GenericNameOrIndex Use idx for ID-based lookup.
   *
   * @return The ServiceGroup message with member_service_ids populated.
   */
  rpc GetServiceGroup(GenericNameOrIndex) returns (ServiceGroup) {}

  /**
   * @brief Return all severities currently held in the broker cache.
   *
   * @return A SeverityList message containing one SeverityEntry per cached
   * severity, with its config ID, type, level and database ID.
   */
  rpc GetSeverities(google.protobuf.Empty) returns (SeverityList) {}

  /**
   * @brief Return the topology of the broker, including all pollers, brokers
   * and their connections. The returned TopologyResponse message contains a
   * list of all peers (pollers and brokers).
   *
   * There is a missing point in the TopologyResponse, if the connection to a
   * poller is established through several brokers, the response is partial
   * because only the direct connection is described. To have a complete view of
   * the topology, clients may need to call GetTopology on each broker to gather
   * all connections and build the full topology graph.
   *
   * For example, if P is a poller and B1, B2 and B3 are brokers, with the
   * following connections: P -> B1 -> B2 -> B3, GetTopology called on B3 will
   * see P as a peer with a connection to B2, but it will not see the
   * connections from P to B1 and from B1 to B2. Broker doesn't store all the
   * connections to pollers, it only knows about its direct connections.
   *
   * @param google.protobuf.Empty The request message is empty, as no parameters
   * are needed to retrieve the topology information.
   *
   * @return TopologyResponse A message containing the list of peers (pollers
   * and brokers) and their details, representing the topology of the broker
   * system. Each peer includes information such as ID, name, type, connection
   * time and configuration details.
   */
  rpc GetTopology(google.protobuf.Empty) returns (TopologyResponse) {}

  /**
   * @brief Return all hosts that carry a given tag (identified by name and
   * type) in the broker cache.
   *
   * @param TagIdentifier Message containing the tag name and type.
   *
   * @return A HostList message with one Host entry per matching host.
   */
  rpc GetHostsByTag(TagIdentifier) returns (HostList) {}

  /**
   * @brief Return all services that carry a given tag (identified by name and
   * type) in the broker cache.
   *
   * @param TagIdentifier Message containing the tag name and type.
   *
   * @return A ServiceList message with one Service entry per matching service.
   */
  rpc GetServicesByTag(TagIdentifier) returns (ServiceList) {}

  /**
   * @brief Return all tags currently held in the broker cache, with the IDs of
   * the pollers that reference each tag.
   *
   * @return A TagList message containing one TagEntry per cached tag.
   */
  rpc GetTags(google.protobuf.Empty) returns (TagList) {}

  /**
   * @brief List the acknowledgements currently held in the Broker cache.
   *
   * @return An AcknowledgementList with one Acknowledgement entry per cached
   * acknowledgement (host acknowledgements have service_id 0).
   */
  rpc GetAcknowledgements(google.protobuf.Empty) returns (AcknowledgementList) {
  }

  /**
   * @brief Schedule a host or service downtime (notification_mode = broker).
   *
   * Only available when the downtime manager has been loaded, i.e. when
   * notification_mode = broker is set in the Broker configuration.
   *
   * @return A ScheduleDowntimeResponse containing the new downtime ID.
   */
  rpc ScheduleDowntime(ScheduleDowntimeRequest)
      returns (ScheduleDowntimeResponse) {}

  /**
   * @brief Delete (cancel) a previously scheduled downtime, by its id.
   */
  rpc DeleteDowntime(DowntimeIdentifier) returns (google.protobuf.Empty) {}

  /**
   * @brief Add a user comment on a host (notification_mode = broker).
   */
  rpc AddHostComment(HostCommentRequest) returns (AddCommentResponse) {}

  /**
   * @brief Add a user comment on a service (notification_mode = broker).
   */
  rpc AddServiceComment(ServiceCommentRequest) returns (AddCommentResponse) {}

  /**
   * @brief Delete a comment by its internal_id (notification_mode = broker).
   * Only comments minted by Broker can be deleted this way: an id minted by a
   * poller is refused with FAILED_PRECONDITION.
   */
  rpc DeleteComment(CommentIdentifier) returns (google.protobuf.Empty) {}

  /**
   * @brief Delete every comment of a host (notification_mode = broker).
   */
  rpc DeleteAllHostComments(HostIdentifier) returns (google.protobuf.Empty) {}

  /**
   * @brief Delete every comment of a service (notification_mode = broker).
   */
  rpc DeleteAllServiceComments(ServiceIdentifier)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Enable or disable the notifications of a host
   * (notification_mode = broker), optionally propagated to its services
   * and/or its child hosts. The switch wins over the configured value and
   * survives Broker and Engine restarts.
   */
  rpc SetHostNotifications(HostNotificationsRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Enable or disable the notifications of a service
   * (notification_mode = broker).
   */
  rpc SetServiceNotifications(ServiceNotificationsRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Set the notification number of a host (notification_mode = broker).
   * Applied asynchronously, serialized with the notification decisions.
   */
  rpc SetHostNotificationNumber(HostNotificationNumberRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Set the notification number of a service
   * (notification_mode = broker).
   */
  rpc SetServiceNotificationNumber(ServiceNotificationNumberRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Send a custom notification on a host (notification_mode = broker).
   * The decision (contacts, escalations, forced bypass) is Broker's, the
   * execution the poller's.
   */
  rpc SendCustomHostNotification(HostCustomNotificationRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Send a custom notification on a service
   * (notification_mode = broker).
   */
  rpc SendCustomServiceNotification(ServiceCustomNotificationRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Change the notification timeperiod of a host (notification_mode =
   * broker). The timeperiod must be known to Broker (NOT_FOUND otherwise). The
   * value wins over the configured one and survives restarts.
   */
  rpc SetHostNotificationPeriod(HostNotificationPeriodRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Change the notification timeperiod of a service (notification_mode =
   * broker).
   */
  rpc SetServiceNotificationPeriod(ServiceNotificationPeriodRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Enable or disable the host notifications of a contact
   * (notification_mode = broker). The switch wins over the configured value and
   * survives restarts.
   */
  rpc SetContactHostNotifications(ContactNotificationsRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Enable or disable the service notifications of a contact
   * (notification_mode = broker).
   */
  rpc SetContactServiceNotifications(ContactNotificationsRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Enable or disable the host notifications of every contact of a
   * contactgroup (notification_mode = broker).
   * Each member gets its own switch, the group holds none.
   */
  rpc SetContactgroupHostNotifications(ContactgroupNotificationsRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Enable or disable the service notifications of every contact of a
   * contactgroup (notification_mode = broker).
   */
  rpc SetContactgroupServiceNotifications(ContactgroupNotificationsRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Change the host notification timeperiod of a contact
   * (notification_mode = broker).
   * The timeperiod must be known to Broker (NOT_FOUND otherwise).
   */
  rpc SetContactHostNotificationPeriod(ContactNotificationPeriodRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Change the service notification timeperiod of a contact
   * (notification_mode = broker).
   */
  rpc SetContactServiceNotificationPeriod(ContactNotificationPeriodRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Enable or disable the notifications of a whole poller
   * (notification_mode = broker).
   * The switch wins over the poller's enable_notifications configuration and
   * survives restarts.
   */
  rpc SetPollerNotifications(PollerNotificationsRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Acknowledge a host problem (notification_mode = broker).
   *
   * Only available when notification_mode = broker; the host must be in a
   * problem state.
   */
  rpc AcknowledgeHostProblem(AcknowledgementRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Acknowledge a service problem (notification_mode = broker).
   *
   * Only available when notification_mode = broker; the service must be in a
   * problem state.
   */
  rpc AcknowledgeServiceProblem(AcknowledgementRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Remove a host acknowledgement (notification_mode = broker).
   */
  rpc RemoveHostAcknowledgement(HostIdentifier)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Remove a service acknowledgement (notification_mode = broker).
   */
  rpc RemoveServiceAcknowledgement(ServiceIdentifier)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Execute a legacy Engine external command through Broker, which
   * routes it to the poller supervising the targeted resource. The command is
   * the line PHP already produces for the Engine command pipe, without the
   * leading "[timestamp] " (accepted if present).
   *
   * Broker resolves the poller(s) and forwards the line; the poller parses and
   * executes it exactly as if it had come from its command pipe. A host or
   * service command goes to the poller supervising the host (first argument),
   * with the resolved ids so the poller does not depend on the names; a
   * contact or contactgroup command goes to every connected poller (each has
   * its copy of the contacts); a global or process command goes to the poller
   * named in the request. Errors are reported synchronously: INVALID_ARGUMENT
   * (malformed or unknown command, missing argument or poller), NOT_FOUND
   * (unknown host, service or poller), UNAVAILABLE (poller not connected),
   * UNIMPLEMENTED (group command, or downtime / comment designated by id),
   * FAILED_PRECONDITION (command that Broker owns in notification_mode =
   * broker: the message names the gRPC method to use instead). The execution
   * itself stays asynchronous.
   */
  rpc ExecuteExternalCommand(ExternalCommandRequest)
      returns (google.protobuf.Empty) {}

  /**
   * @brief Validate an Engine poller configuration directory without applying
   * it. The directory holds centengine.cfg and the .cfg files PHP generated.
   *
   * @return The list of configuration diagnostics (warnings/errors) and a flag
   * telling whether the configuration is applicable (no error).
   */
  rpc CheckPollerConfig(CheckPollerConfigRequest)
      returns (CheckPollerConfigResponse) {}

  /**
   * @brief Evaluate the notification dependencies of a host or service, as the
   * Broker sees them in its cache.
   *
   * @param ServiceIdentifier The dependent resource, by name or by ID. Leave
   * the service oneof unset for a host-level check.
   *
   * @return A NotificationAuthorizedByDependenciesResponse whose authorized
   * flag tells whether the notification dependencies allow a notification, or
   * grpc::StatusCode::NOT_FOUND if the resource is not in the cache.
   */
  rpc NotificationAuthorizedByDependencies(ServiceIdentifier)
      returns (NotificationAuthorizedByDependenciesResponse) {}
}

message PollerEntry {
  uint64 poller_id = 1;
  string poller_name = 2;
}

message BrokerEntry {
  uint64 poller_id = 1;
  string broker_name = 2;
  repeated PollerEntry pollers = 3;
}

message TopologyResponse {
  repeated BrokerEntry direct_brokers = 1;
  repeated PollerEntry direct_pollers = 2;
}

message PeerList {
  repeated Peer peers = 1;
}

message IdsList {
  repeated uint64 ids = 1;
}

message IdsPairsList {
  message IdsPair {
    uint64 host_id = 1;
    uint64 service_id = 2;
  }
  repeated IdsPair pairs = 1;
}

message Peer {
  uint32 id = 1;
  string poller_name = 2;
  string broker_name = 3;
  google.protobuf.Timestamp connected_since = 4;
  common.PeerType type = 5;
  string engine_conf = 6;
  string available_conf = 7;
  /* Local timezone (IANA name) advertised by the poller machine in its Welcome
   * message. Only meaningful for ENGINE peers; empty when the peer sent none.
   */
  string timezone = 8;
}

message AesMessage {
  string app_secret = 1;
  string salt = 2;
  string content = 3;
}

message Version {
  int32 major = 1;
  int32 minor = 2;
  int32 patch = 3;
}

message LogInfo {
  string log_name = 1;
  string log_file = 2;
  uint32 log_flush_period = 3;
  map<string, string> level = 4;
}

message LogLevel {
  string logger = 1;
  enum LogLevelEnum {
    TRACE = 0;
    DEBUG = 1;
    INFO = 2;
    WARNING = 3;
    ERROR = 4;
    CRITICAL = 5;
    OFF = 6;
  }
  LogLevelEnum level = 2;
}

message LogFlushPeriod {
  uint32 period = 1;
}

message GenericString {
  string str_arg = 1;
}

message GenericInt {
  uint32 value = 1;
}

message GenericSize {
  uint32 size = 1;
}

message AcknowledgementRequest {
  string host_name = 1;
  string service_desc = 2;
  string ack_author = 3;
  string ack_data = 4;
  enum Type {
    NORMAL = 0;
    STICKY = 1;
  }
  Type type = 5;
  bool notify = 6;
  bool persistent = 7;
}

message GenericNameOrIndex {
  oneof nameOrIndex {
    string str = 1;
    uint64 idx = 2;
  }
}

message HostIdentifier {
  oneof host {
    string host_name = 1;
    uint64 host_id = 2;
  }
}

message DowntimeIdentifier {
  uint64 downtime_id = 1;
}

message CommentIdentifier {
  uint64 internal_id = 1;
}

/* User comment on a host; same content as Engine's EngineComment, the resource
 * being identified by name or id like everywhere else in this API. */
message HostCommentRequest {
  HostIdentifier host = 1;
  string user = 2;
  string comment_data = 3;
  bool persistent = 4;
  uint32 entry_time = 5;  // 0: now
}

message ServiceCommentRequest {
  ServiceIdentifier service = 1;
  string user = 2;
  string comment_data = 3;
  bool persistent = 4;
  uint32 entry_time = 5;  // 0: now
}

message AddCommentResponse {
  uint64 internal_id = 1;
}

message HostNotificationsRequest {
  enum Scope {
    HOST = 0;               // the host only
    HOST_AND_SERVICES = 1;  // the host and all its services
    HOST_AND_CHILDREN = 2;  // the host and its child hosts, recursively
                            // (no service)
    BEYOND_HOST = 3;        // the child hosts, recursively, with their
                            // services; the host itself is left untouched
  }
  HostIdentifier host = 1;
  bool enabled = 2;
  Scope scope = 3;
}

message ServiceNotificationsRequest {
  ServiceIdentifier service = 1;
  bool enabled = 2;
}

message HostNotificationNumberRequest {
  HostIdentifier host = 1;
  uint32 number = 2;
}

message ServiceNotificationNumberRequest {
  ServiceIdentifier service = 1;
  uint32 number = 2;
}

/* Custom notification; the three flags are Engine's option bits (1, 2, 4). */
message HostCustomNotificationRequest {
  HostIdentifier host = 1;
  string author = 2;
  string comment = 3;
  bool broadcast = 4;  // notify every contact, escalations ignored
  bool forced = 5;     // bypass the enabled switches and periods
  bool increment = 6;  // count it in the notification number
}

message ServiceCustomNotificationRequest {
  ServiceIdentifier service = 1;
  string author = 2;
  string comment = 3;
  bool broadcast = 4;
  bool forced = 5;
  bool increment = 6;
}

message HostNotificationPeriodRequest {
  HostIdentifier host = 1;
  string timeperiod = 2;  // name of a timeperiod known to Broker
}

message ServiceNotificationPeriodRequest {
  ServiceIdentifier service = 1;
  string timeperiod = 2;
}

/* Contacts and contactgroups have no id in the configuration: name only. */
message ContactIdentifier {
  string name = 1;
}

message ContactgroupIdentifier {
  string name = 1;
}

message PollerIdentifier {
  oneof poller {
    uint64 poller_id = 1;
    string poller_name = 2;
  }
}

message ExternalCommandRequest {
  /* The legacy line, "[timestamp] " prefix optional. */
  string command = 1;
  /* Required for a global or process command (the legacy pipe designated the
   * poller, here the request must): the Engine it applies to. Ignored for a
   * host, service, contact or contactgroup command. */
  PollerIdentifier poller = 2;
}

message PollerNotificationsRequest {
  PollerIdentifier poller = 1;
  bool enabled = 2;
}

message ContactNotificationsRequest {
  ContactIdentifier contact = 1;
  bool enabled = 2;
}

message ContactgroupNotificationsRequest {
  ContactgroupIdentifier contactgroup = 1;
  bool enabled = 2;
}

message ContactNotificationPeriodRequest {
  ContactIdentifier contact = 1;
  string timeperiod = 2;
}

message ServiceIdentifier {
  oneof host {
    string host_name = 1;
    uint64 host_id = 2;
  }
  oneof service {
    string description = 3;
    uint64 service_id = 4;
  }
}

message GenericResponse {
  bool ok = 1;
  string err_msg = 2;
}

/**
 * @brief This is the message given to the GetSqlManagerStats. It is possible
 * to specify an index representing which connection to display. If no value
 * is given all the connections are returned.
 */
message SqlConnection {
  optional uint32 id = 1;
}

message SqlConnectionStats {
  int32 waiting_tasks = 1;
  oneof last_switch {
    int64 up_since = 2;
    int64 down_since = 3;
  };
  float average_loop_duration = 4;
  uint32 average_tasks_count = 5;
  float activity_percent = 6;
  float average_query_duration = 7;
  float average_statement_duration = 8;

  message QueryStats {
    uint32 length = 1;
    float duration = 2;
    int64 start_time = 3;
    string query = 4;
  };
  message StatementStats {
    float rows_count = 1;
    float duration = 2;
    int64 start_time = 3;
    uint32 statement_id = 4;
    string statement_query = 5;
  };

  repeated QueryStats slowest_queries = 9;
  repeated StatementStats slowest_statements = 10;
}

message SqlManagerStatsOptions {
  optional uint32 slowest_statements_count = 1;
  optional uint32 slowest_queries_count = 2;
}

message SqlManagerStats {
  repeated SqlConnectionStats connections = 1;
}

message ConflictManagerStats {
  int32 events_handled = 1;
  int32 waiting_events = 2;
  int32 max_pending_events = 3;
  int32 sql = 4;
  int32 storage = 5;
  uint32 max_perfdata_events = 6;
  uint32 loop_timeout = 7;
  double speed = 8;
}

message ModuleStats {
  string name = 1;
  string size = 2;
  string state = 3;
}

message ThreadPool {
  float latency = 1;
  uint32 size = 2;
}

message EngineStats {
  enum Mode {
    NOT_STARTED = 0;
    RUNNING = 1;
    STOPPED = 2;
  }
  Mode mode = 1;
  uint32 processed_events = 2;
  uint64 queue_size = 3;
  uint64 available = 4;
}

message QueueFileStats {
  string name = 1;
  uint32 max_file_size = 2;
  uint32 file_write_path = 3;
  uint32 file_write_offset = 4;
  uint32 file_read_path = 5;
  uint32 file_read_offset = 6;
  double file_percent_processed = 7;
  int64 file_expected_terminated_at = 8;
  string file_expected_terminated_in = 9;
}

message MuxerStats {
  uint32 total_events = 1;
  uint32 unacknowledged_events = 2;
  QueueFileStats queue_file = 3;
}

message ProcessingStats {
  EngineStats engine = 1;
  map<string, MuxerStats> muxers = 2;
}

message BrokerStats {
  string asio_version = 1;
  string version = 2;
  uint32 pid = 3;
  int64 now = 4;
  ThreadPool pool_stats = 5;
  repeated ModuleStats modules = 6;
  SqlManagerStats sql_manager = 7;
  ConflictManagerStats conflict_manager = 8;
  ProcessingStats processing = 9;
}

message IndexIds {
  repeated uint64 index_ids = 1;
}

message BaInfo {
  uint64 id = 1;
  string output_file = 2;
}

message ToRemove {
  repeated uint64 index_ids = 1;
  repeated uint64 metric_ids = 2;
}

/**
 * @brief One entry in the broker cache for a severity.
 *
 * config_id and type together form the unique key in the cache.
 * level is the numeric severity level from the Engine configuration.
 * db_id is the MariaDB auto-increment primary key (0 if not yet persisted).
 */
message SeverityEntry {
  uint64 config_id = 1;
  Severity.Type type = 2;
  uint32 level = 3;
  uint64 db_id = 4;  // MariaDB row ID, 0 if not yet in database
}

message SeverityList {
  repeated SeverityEntry entries = 1;
}

/**
 * @brief Identifies a tag by its name and type.
 */
message TagIdentifier {
  string name = 1;
  TagType type = 2;
}

message HostList {
  repeated Host hosts = 1;
}

message ServiceList {
  repeated Service services = 1;
}

/**
 * @brief One entry in the broker cache for a tag.
 *
 * id and type together form the unique key. name is the human-readable label.
 * poller_ids lists the pollers that currently reference this tag; the tag is
 * kept in the cache as long as at least one poller references it.
 */
message TagEntry {
  uint64 id = 1;
  TagType type = 2;
  string name = 3;
  repeated uint64 poller_ids = 4;
}

message TagList {
  repeated TagEntry entries = 1;
}

/* Acknowledgement is defined in neb.proto (same package). */
message AcknowledgementList {
  repeated Acknowledgement entries = 1;
}

message ScheduleDowntimeRequest {
  enum DowntimeType {
    HOST = 0;
    SERVICE = 1;
  }
  DowntimeType type = 1;
  oneof host {
    string host_name = 2;
    uint64 host_id = 3;
  }
  oneof service {
    string service_description = 4;
    uint64 service_id = 5;
  }
  int64 entry_time = 6;
  string author = 7;
  string comment_data = 8;
  int64 start_time = 9;
  int64 end_time = 10;
  bool fixed = 11;
  uint64 triggered_by = 12;
  uint32 duration = 13;
}

message ScheduleDowntimeResponse {
  uint64 downtime_id = 1;
}

message CheckPollerConfigRequest {
  // Directory holding centengine.cfg and the other Engine .cfg files.
  string directory = 1;
}

message ConfigDiagnostic {
  enum Severity {
    WARNING = 0;
    ERROR = 1;
  }
  Severity severity = 1;
  string message = 2;
}

message CheckPollerConfigResponse {
  // true when the configuration has no error (warnings are tolerated).
  bool ok = 1;
  repeated ConfigDiagnostic diagnostics = 2;
}

message NotificationAuthorizedByDependenciesResponse {
  // true when the notification dependencies of the resource authorize a
  // notification.
  bool authorized = 1;
}
