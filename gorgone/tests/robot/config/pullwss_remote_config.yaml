gorgone:
  gorgonecore:
    id: 3
  modules:
    - name: pullwss
      package: "gorgone::modules::core::pullwss::hooks"
      enable: true
      ssl: false
      port: 8086
      token: "secret_token"
      address: 127.0.0.1
      ping: 1

    - name: proxy
      package: "gorgone::modules::core::proxy::hooks"
      enable: true
      httpserver:
        enable: true
        ssl: false
        #ssl_cert_file: /etc/centreon-gorgone/keys/certificate.crt
        #ssl_key_file: /etc/centreon-gorgone/keys/private.key
        token: "secret_token"
        address: "0.0.0.0"
        port: 8096

    - name: nodes
      package: "gorgone::modules::centreon::nodes::hooks"
      enable: true

    - name: httpserver
      package: "gorgone::modules::core::httpserver::hooks"
      enable: true
      address: "0.0.0.0"
      port: "8095"
      ssl: false
      auth:
        enabled: false
      allowed_hosts:
        enabled: true
        subnets:
          - 127.0.0.1/32
