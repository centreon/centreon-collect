[package]
name = "gorgone-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
gorgone-agent = { path = "../gorgone-agent" }
gorgone-core = { path = "../gorgone-core" }
gorgone-server = { path = "../gorgone-server" }
nix = { version = "0.31.3", features = ["fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
