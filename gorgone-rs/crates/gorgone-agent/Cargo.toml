[package]
name = "gorgone-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Poller-side executor of Gorgone: runs typed jobs received from gorgone-server"

[[bin]]
name = "gorgone-agent"
path = "src/main.rs"

[features]
# Trust the certificate authorities of the system when `tls.ca_file` is unset.
native-roots = ["tonic/tls-native-roots"]

[dependencies]
anyhow = "1.0.104"
gorgone-core = { version = "0.1.0", path = "../gorgone-core" }
gorgone-proto = { version = "0.1.0", path = "../gorgone-proto" }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
prost = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "io-util"] }
tokio-stream = { version = "0.1.19", default-features = false }
tokio-util = "0.7.20"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "tls-ring"] }
