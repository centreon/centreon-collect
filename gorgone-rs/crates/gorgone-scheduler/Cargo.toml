[package]
name = "gorgone-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Monitoring scheduler of gorgone-agent: runs the checks of a Centreon poller and sends the results to Centreon Broker over BBDO"

# Only crates the workspace already builds: no new entry in Cargo.lock.
[dependencies]
gorgone-proto = { version = "0.1.0", path = "../gorgone-proto" }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
prost = "0.14"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "process", "time", "sync", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
