# Integration bench: a real centreon-web (central) and a real poller from the
# Centreon test images, with the Perl gorgoned replaced by gorgone-server and
# gorgone-agent. Local test use only (plaintext, no API credentials).
#
#   docker compose -f deploy/centreon/compose.yaml up --build -d
#   deploy/centreon/verify.sh
#   docker compose -f deploy/centreon/compose.yaml down -v
#
# Web UI: http://localhost:4000 (admin / Centreon!2021, the test image
# defaults). WEB_IMAGE and POLLER_IMAGE select other versions of the images.

name: gorgone-rs-centreon

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/centreon/Dockerfile
      target: web
      args:
        WEB_IMAGE: ${WEB_IMAGE:-docker.centreon.com/centreon/centreon-web-alma9:develop}
    ports: ["127.0.0.1:4000:80", "127.0.0.1:8085:8085"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_ROOT_PASSWORD: centreon
      MYSQL_USER: centreon
      MYSQL_PASSWORD: centreon
      CENTREON_DATASET: "1"
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/docker.ready ] && curl --fail http://localhost/centreon/api/latest/platform/versions"]
      interval: 2s
      retries: 150
      timeout: 5s

  db:
    image: ${MYSQL_IMAGE:-bitnamilegacy/mariadb:11.8}
    environment:
      # Throwaway values of the Centreon test images.
      MARIADB_ROOT_PASSWORD: centreon
      MARIADB_USER: centreon
      MARIADB_PASSWORD: centreon
      MARIADB_EXTRA_FLAGS: "--skip-name-resolve --innodb-flush-method=nosync --innodb-log-file-size=32M --secure-file-priv= --skip-ssl"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3306 && sleep 3 && </dev/tcp/127.0.0.1/3306'"]
      interval: 5s
      timeout: 15s
      retries: 40

  poller:
    build:
      context: ../..
      dockerfile: deploy/centreon/Dockerfile
      target: poller
      args:
        POLLER_IMAGE: ${POLLER_IMAGE:-docker.centreon.com/centreon/centreon-poller-alma9:develop}
    hostname: poller
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_HOST: web
