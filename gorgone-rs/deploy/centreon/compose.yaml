# Integration bench with real Centreon components, each in its own container,
# and no centreon-collect, Gorgone or plugin package next to centreon-web:
#
#   db              MariaDB (Centreon databases and the gorgone-server store)
#   gorgone-server  the Rust control plane, alone in a distroless image
#   web             the slim centreon-web image: PHP and Apache only
#   broker          the central broker (cbd), SQL output
#   broker-rrd      the RRD broker (cbd); its files are shared with web
#   central-engine  the engine of the "Central" poller, with its agent sidecar
#   poller          the Centreon poller test image, driven by gorgone-agent
#   engine          a second container-only poller, with its agent sidecar
#
# Local test use only: plaintext listeners, throwaway credentials.
#
#   export CENTREON_SRC=/path/to/centreon   # checkout of the gorgone API branch
#   docker compose -f deploy/centreon/compose.yaml up --build -d
#   deploy/centreon/verify.sh
#   docker compose -f deploy/centreon/compose.yaml down -v
#
# Web UI: http://localhost:4000 (admin / Centreon!2021, the test image
# defaults). The engine image is built from this branch: engine/README.md.

name: gorgone-rs-centreon

x-gorgone-api: &gorgone-api
  GORGONE_API_USERNAME: centreon-web
  # Throwaway value shared by the containers of this bench.
  GORGONE_API_PASSWORD: bench-only

x-engine: &engine
  image: ${ENGINE_IMAGE:-centreon-engine-trixie:gorgone-poc}
  # "restart" is: the agent asks the engine to exit, docker starts it again.
  restart: always
  environment:
    # The engine API has no authentication: it is served on a socket shared
    # with the sidecar only, nothing listens on the network.
    ENGINE_RPC_LISTEN_ADDRESS: unix:/var/lib/centreon-engine/rw/engine.sock

x-agent: &agent
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
    target: agent
  command: ["--config", "/agent/agent.toml"]
  # The engine user, which owns the configuration volumes; the broker group
  # for the broker configuration directory.
  user: "901:901"
  group_add: ["902"]
  restart: on-failure
  # Destination of the vmware target, unused by these pollers.
  tmpfs:
    - /etc/centreon:uid=901,gid=901

x-broker: &broker
  image: ${BROKER_IMAGE:-docker.centreon.com/centreon/centreon-broker-trixie:develop}
  # The image refuses its packaged configuration: it restarts until the
  # central agent has pushed the one generated by centreon-web.
  restart: always

x-script: &script
  image: ${ENGINE_IMAGE:-centreon-engine-trixie:gorgone-poc}
  volumes:
    - ./engine/register.py:/register.py:ro

services:
  db:
    image: ${MYSQL_IMAGE:-bitnamilegacy/mariadb:11.8}
    environment:
      # Throwaway values of the Centreon test images.
      MARIADB_ROOT_PASSWORD: centreon
      MARIADB_USER: centreon
      MARIADB_PASSWORD: centreon
      MARIADB_DATABASE: gorgone
      MARIADB_EXTRA_FLAGS: "--skip-name-resolve --innodb-flush-method=nosync --innodb-log-file-size=32M --secure-file-priv= --skip-ssl"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3306 && sleep 3 && </dev/tcp/127.0.0.1/3306'"]
      interval: 5s
      timeout: 15s
      retries: 40

  gorgone-server:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: server
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      GORGONE_SERVER__DATABASE_URL: mysql://centreon:centreon@db/gorgone
      GORGONE_SERVER__REST_LISTEN: 0.0.0.0:8085
      GORGONE_SERVER__AGENT_LISTEN: 0.0.0.0:5556
      GORGONE_SERVER__ALLOW_PLAINTEXT: "true"
      GORGONE_SERVER__REST__BASIC_USERNAME: centreon-web
      GORGONE_SERVER__REST__BASIC_PASSWORD: bench-only
      # Bench only: agents are accepted without enrolment.
      GORGONE_SERVER__AUTO_ENROLL: "true"
    ports: ["127.0.0.1:8085:8085"]

  web:
    build:
      context: ${CENTREON_SRC:?set CENTREON_SRC to a checkout of centreon/centreon with the Gorgone API branch}
      dockerfile: .github/docker/centreon-web/alma9/Dockerfile.slim
      args:
        WEB_IMAGE: ${WEB_IMAGE:-docker.centreon.com/centreon/centreon-web-alma9:develop}
    ports: ["127.0.0.1:4000:80"]
    depends_on:
      db:
        condition: service_healthy
      gorgone-server:
        condition: service_started
    environment:
      <<: *gorgone-api
      MYSQL_HOST: db
      MYSQL_ROOT_PASSWORD: centreon
      MYSQL_USER: centreon
      MYSQL_PASSWORD: centreon
      CENTREON_DATASET: "1"
      # The legacy pages call the internal API: without this they reuse the
      # port published on the host, which nothing listens on in the container.
      CENTREON_INTERNAL_API_BASE_URL: 127.0.0.1:80
      GORGONE_API_ADDRESS: gorgone-server
    volumes:
      # Graphs are drawn from the files written by the RRD broker.
      - rrd-metrics:/var/lib/centreon/metrics:ro
      - rrd-status:/var/lib/centreon/status:ro
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/docker.ready ] && curl --fail http://localhost/centreon/api/latest/platform/versions"]
      interval: 2s
      retries: 150
      timeout: 5s

  # centreon-web generates a configuration for a broker on its own host:
  # point the flows at the broker containers instead.
  central-setup:
    image: ${MYSQL_IMAGE:-bitnamilegacy/mariadb:11.8}
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./central/setup.sql:/setup.sql:ro
    entrypoint: ["bash", "-c", "mariadb --skip-ssl -hdb -uroot -pcentreon centreon < /setup.sql"]

  # The brokers decrypt the database password of their configuration, the
  # engines the credentials of theirs: give them the key of centreon-web.
  secrets:
    <<: *script
    entrypoint: ["python3", "/register.py", "secrets"]
    user: root
    depends_on:
      web:
        condition: service_healthy
    environment:
      SECRET_DIRS: /secrets/broker /secrets/central-engine /secrets/engine
    volumes:
      - ./engine/register.py:/register.py:ro
      - broker-secrets:/secrets/broker
      - central-engine-etc:/secrets/central-engine
      - engine-etc:/secrets/engine

  volumes-init:
    image: ${ENGINE_IMAGE:-centreon-engine-trixie:gorgone-poc}
    user: root
    # Fresh volumes belong to root: the RRD broker writes the first two. The
    # broker configuration directory is shared by the engine, its sidecar and
    # both brokers: start it from the engine image content, which the engine
    # needs to boot before its first real configuration arrives.
    entrypoint:
      - sh
      - -c
      - |
        chown 902:902 /metrics /status
        cp -an /etc/centreon-broker/. /central-broker-etc/
        chown -R 901:902 /central-broker-etc
        chmod 2775 /central-broker-etc
    volumes:
      - rrd-metrics:/metrics
      - rrd-status:/status
      - central-broker-etc:/central-broker-etc

  broker:
    <<: *broker
    hostname: broker
    depends_on:
      volumes-init:
        condition: service_completed_successfully
    volumes:
      - central-broker-etc:/etc/centreon-broker
      - broker-secrets:/etc/centreon-engine:ro

  broker-rrd:
    <<: *broker
    hostname: broker-rrd
    command:
      - /opt/centreon/venv/bin/python3
      - /usr/local/lib/centreon-broker/api_control.py
      - /etc/centreon-broker/central-rrd.json
    depends_on:
      volumes-init:
        condition: service_completed_successfully
    volumes:
      - central-broker-etc:/etc/centreon-broker
      - broker-secrets:/etc/centreon-engine:ro
      - rrd-metrics:/var/lib/centreon/metrics
      - rrd-status:/var/lib/centreon/status

  # The "Central" poller: an engine container and its sidecar. The sidecar
  # also receives the configuration of the two brokers above.
  central-engine:
    <<: *engine
    hostname: central-engine
    depends_on:
      volumes-init:
        condition: service_completed_successfully
    volumes:
      - central-engine-etc:/etc/centreon-engine
      - central-broker-etc:/etc/centreon-broker
      - central-engine-rw:/var/lib/centreon-engine/rw

  central-agent:
    <<: *agent
    depends_on:
      gorgone-server:
        condition: service_started
    volumes:
      - ./central/agent.toml:/agent/agent.toml:ro
      - central-engine-etc:/etc/centreon-engine
      - central-broker-etc:/etc/centreon-broker
      - central-engine-rw:/var/lib/centreon-engine/rw

  central-deploy:
    <<: *script
    entrypoint: ["python3", "/register.py", "deploy"]
    depends_on:
      central-setup:
        condition: service_completed_successfully
      secrets:
        condition: service_completed_successfully
      central-agent:
        condition: service_started
    environment:
      <<: *gorgone-api
      POLLER_NAME: Central
      # The first push gives the brokers their configuration: wait for them
      # before the restart, which also reloads them.
      WAIT_FOR_URLS: http://broker:8080/health http://broker-rrd:8080/health

  poller:
    build:
      context: ../..
      dockerfile: deploy/centreon/Dockerfile
      target: poller
      args:
        POLLER_IMAGE: ${POLLER_IMAGE:-docker.centreon.com/centreon/centreon-poller-alma9:develop}
    hostname: poller
    depends_on:
      central-setup:
        condition: service_completed_successfully
    environment:
      <<: *gorgone-api
      WEB_HOST: web
      GORGONE_HOST: gorgone-server
      BROKER_HOST: broker

  # A poller made of containers only: no command pipe, no systemctl, no SSH.
  engine:
    <<: *engine
    hostname: engine
    volumes:
      - engine-etc:/etc/centreon-engine
      - broker-etc:/etc/centreon-broker
      - engine-rw:/var/lib/centreon-engine/rw

  engine-register:
    <<: *script
    entrypoint: ["python3", "/register.py", "register"]
    # Writes the agent configuration into a fresh, root-owned volume.
    user: root
    depends_on:
      central-setup:
        condition: service_completed_successfully
    volumes:
      - ./engine/register.py:/register.py:ro
      - agent-config:/agent

  engine-agent:
    <<: *agent
    depends_on:
      engine-register:
        condition: service_completed_successfully
    volumes:
      - agent-config:/agent:ro
      - engine-etc:/etc/centreon-engine
      - broker-etc:/etc/centreon-broker
      - engine-rw:/var/lib/centreon-engine/rw

  engine-deploy:
    <<: *script
    entrypoint: ["python3", "/register.py", "deploy"]
    depends_on:
      engine-agent:
        condition: service_started
    environment:
      <<: *gorgone-api

volumes:
  broker-secrets:
  rrd-metrics:
  rrd-status:
  central-engine-etc:
  central-engine-rw:
  central-broker-etc:
  engine-rw:
  engine-etc:
  broker-etc:
  agent-config:
