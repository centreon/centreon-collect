# gorgone-agent of the rust-poller container: the whole poller. Its built-in
# scheduler runs the checks of the Engine configuration centreon-web pushes,
# and sends the results to the central broker over BBDO: no centengine, no
# cbd. The node id comes from the environment (GORGONE_AGENT__NODE_ID).
server_url = "http://gorgone:5556"
# Bench value: gorgone-server enrols nodes automatically here.
token = "integration-test"
# On the container's own filesystem.
state_dir = "/var/lib/centreon-gorgone/agent"

[commands]
allowlist = []

[engine]
# Handled by the scheduler: the forced and planned checks and the passive
# results; the other ones the web may send are refused by the scheduler.
allowed_commands = [
  'SCHEDULE_(FORCED_)?(HOST|SVC)_CHECK',
  'PROCESS_(HOST|SERVICE)_CHECK_RESULT',
]

[scheduler]
enabled = true
# Plugins running at once.
max_concurrent_checks = 64

[targets.engine_context]
path = "/etc/centreon-engine"
prune = false
file_mode = "0640"

[targets.engine]
path = "/etc/centreon-engine"
prune = true
# Checked by the scheduler's own parser before it is applied.
engine_main_file = "centengine.cfg"

# The broker module file: poller identity and central broker address.
[targets.broker]
path = "/etc/centreon-broker"
prune = false

[targets.vmware]
path = "/var/lib/centreon-gorgone/vmware"
prune = false

# Reload and restart: the scheduler reads the pushed files again, in process.
[services.engine]
reload = "scheduler:reload"
restart = "scheduler:reload"

[services.broker]
reload = "scheduler:reload"
