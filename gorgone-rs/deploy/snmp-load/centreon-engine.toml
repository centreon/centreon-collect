# centreon-engine of the SNMP load test: Engine files generated by
# gen-config.py (input "files"), results to the BBDO sink. No gorgone-server:
# the agent link retries in the background and does not affect the checks.
node_id = "1"
server_url = "http://127.0.0.1:9"
token = "load-test"
state_dir = "/var/lib/centreon-engine"

[commands]
allowlist = []

[targets.engine]
path = "/etc/centreon-engine/conf"
prune = false

[scheduler]
input = "files"
target = "engine"
main_file = "centengine.cfg"
# Overridden per run with CENTREON_ENGINE__SCHEDULER__MAX_CONCURRENT_CHECKS.
max_concurrent_checks = 256
