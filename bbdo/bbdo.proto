syntax = "proto3";

import "common.proto";

package com.centreon.broker;

/* Ignore */
message Bbdo {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

/* io::bbdo, bbdo::de_welcome, 49 */
message Welcome {
  Bbdo version = 1;
  string extensions = 2;
  uint64 poller_id = 3;
  string poller_name = 4;
  /* Broker name is more relevant than poller name because for example on the
   * central, rrd broker, central broker and engine share the same poller name
   * that is 'Central'. */
  string broker_name = 5;
  com.centreon.common.PeerType peer_type = 6;
  bool extended_negotiation = 7;
  /* The sender accepts downstream remote actions (commands, configuration)
   * on this stream. Set by a poller only when its configuration allows it. */
  bool remote_actions = 8;
  /* The sender also runs RemoteExec requests (implemented and remote actions
   * accepted; its allow-list may still refuse every program). */
  bool remote_exec = 9;
  /* The sender also installs plugin packages on request (PluginInstall):
   * remote actions accepted and an install command configured. */
  bool plugin_install = 10;
}

/* io::bbdo, bbdo::de_pb_ack, 50 */
message Ack {
  uint32 acknowledged_events = 1;
}

/* io::bbdo, bbdo::de_pb_stop, 51 */
message Stop {
  uint64 poller_id = 1;
}

/* io::bbdo, bbdo::de_pb_engine_configuration, 52 */
message EngineConfiguration {
  uint64 poller_id = 1;    // Poller ID of the sender (Engine or Broker)
  string poller_name = 2;  // Poller name of the sender
  string broker_name = 3;  // Broker name of the sender
  com.centreon.common.PeerType peer_type =
      4;  // Peer type of the sender (Engine or Broker)
  string engine_config_version =
      5;  // Engine uses this to send the conf version
  bool need_update =
      6;  // Broker uses this to tell Engine if an update is needed
}

enum RemoteStatus {
  REMOTE_UNKNOWN = 0;
  REMOTE_DELIVERED = 1;
  REMOTE_APPLIED = 2;
  REMOTE_REJECTED = 3;
  REMOTE_TIMEOUT = 4;  // PluginInstall only: the install was killed
}

/* Downstream events (central Broker -> poller cbmod). They travel on the
 * existing BBDO stream, are consumed by the BBDO layer and are never published
 * to the muxers. */

/* io::bbdo, bbdo::de_pb_remote_command, 61 */
message RemoteCommand {
  string request_id = 1;
  uint64 deadline = 2;  // epoch seconds, the poller drops expired commands
  repeated string commands = 3;  // "[ts] CMD;args", centengine.cmd format
}

/* io::bbdo, bbdo::de_pb_config_chunk, 62 */
message ConfigChunk {
  string request_id = 1;
  uint32 index = 2;     // file index in the deployment
  string target = 3;    // "engine" or "broker"
  string path = 4;      // relative path under the target directory
  string sha256 = 5;    // hex SHA-256 of the whole file
  bytes data = 6;       // part of the file content
  bool last = 7;        // last chunk of this file
}

/* io::bbdo, bbdo::de_pb_config_commit, 63 */
message ConfigCommit {
  string request_id = 1;
  string action = 2;  // "none", "reload" or "restart"
  uint32 files_count = 3;
}

/* io::bbdo, bbdo::de_pb_remote_result, 64 */
message RemoteResult {
  string request_id = 1;
  int32 index = 2;  // command index, -1 for the whole request
  RemoteStatus status = 3;
  string message = 4;
  string config_version = 5;
  repeated string plugins_missing = 6;
  /* Plugin install outcome (index -2): one entry per package of plugins.json */
  repeated PluginPackage plugins = 7;
}

enum ExecState {
  EXEC_UNKNOWN = 0;
  EXEC_RUNNING = 1;   // started, an output chunk or a heartbeat
  EXEC_DONE = 2;      // the process ended, exit_code set
  EXEC_REJECTED = 3;  // refused before start (allow-list, queue, argv...)
  EXEC_TIMEOUT = 4;   // killed at timeout_s
  EXEC_FAILED = 5;    // could not start, or internal error
}

/* Run an allow-listed program on the poller and return its output (central
 * Broker -> poller cbmod). argv is never logged. */
/* io::bbdo, bbdo::de_pb_remote_exec, 65 */
message RemoteExec {
  string request_id = 1;
  uint64 deadline = 2;          // epoch seconds, expired requests are refused
  repeated string argv = 3;     // argv[0] absolute path, no shell
  uint32 timeout_s = 4;         // 1..3600, 0 means 300
  uint32 max_output_bytes = 5;  // 0 means the poller cap
  reserved 6;                   // packages (plugin install before the run)
}

/* Progress and outcome of a RemoteExec (poller cbmod -> central Broker). */
/* io::bbdo, bbdo::de_pb_remote_exec_result, 66 */
message RemoteExecResult {
  string request_id = 1;
  uint32 seq = 2;  // 1, 2, 3... per request, no gap
  ExecState state = 3;
  bytes stdout_chunk = 4;  // at most 256 KiB, in order
  int32 exit_code = 5;     // EXEC_DONE only
  bytes stderr_tail = 6;   // final event, last 4 KiB of stderr
  bool truncated = 7;      // final event, stdout went past the cap
  uint64 output_bytes = 8; // final event, total stdout produced
  string message = 9;      // reason, never argv
}

/* Install plugin packages on the poller (central Broker -> poller cbmod),
 * without touching its plugins.json. The poller validates every name and
 * answers with RemoteResult index -2. */
/* io::bbdo, bbdo::de_pb_plugin_install, 67 */
message PluginInstall {
  string request_id = 1;
  uint64 deadline = 2;               // epoch seconds, expired requests are refused
  map<string, string> packages = 3;  // deb name -> version prefix ("" = any)
  uint32 timeout_s = 4;              // 0 means 600, at most 1800
}

/* Ignore */
message PluginPackage {
  string name = 1;
  string status = 2;  // installed | failed
  string message = 3;
}
