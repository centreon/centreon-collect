syntax = "proto3";

import "common.proto";

package com.centreon.broker;

/* Ignore */
message Bbdo {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

/* io::bbdo, bbdo::de_welcome, 49 */
message Welcome {
  Bbdo version = 1;
  string extensions = 2;
  uint64 poller_id = 3;
  string poller_name = 4;
  /* Broker name is more relevant than poller name because for example on the
   * central, rrd broker, central broker and engine share the same poller name
   * that is 'Central'. */
  string broker_name = 5;
  com.centreon.common.PeerType peer_type = 6;
  bool extended_negotiation = 7;
  /* Engine configuration version sent by Engine so Broker is aware of it. */
  string engine_conf = 8;
  /* Local timezone of the poller machine (IANA name), sent by Engine so Broker
   * can evaluate notification/dependency timeperiods in the poller's timezone
   * when a host/service carries no explicit timezone. Empty for non-Engine
   * peers. */
  string timezone = 9;
}

/* io::bbdo, bbdo::de_pb_ack, 50 */
message Ack {
  uint32 acknowledged_events = 1;
}

/* io::bbdo, bbdo::de_pb_stop, 51 */
message Stop {
  uint64 poller_id = 1;
}

/* io::bbdo, bbdo::de_pb_diff_state_ack, 55 */
message DiffStateAck {
  uint64 poller_id = 1;
  string config_version = 2;
}

/* Sent by a relay Broker to its upstream Broker to request the Engine
 * configuration for the given poller. The config_version field carries the
 * version currently known by the relay (empty if none). */
/* io::bbdo, bbdo::de_pb_config_request, 58 */
message ConfigRequest {
  uint64 poller_id = 1;
  string poller_name = 2;
  string config_version = 3;
}

/* Sent by upstream Broker to a relay to inform it that the given poller is
 * no longer managed by the central and the relay should stop forwarding its
 * configuration. */
/* io::bbdo, bbdo::de_pb_config_revoke, 59 */
message ConfigRevoke {
  uint64 poller_id = 1;
}

/* Written on disk (topology.cache) on clean central shutdown. Loaded on
 * restart as routing hints: engine peer N is reachable via relay R. */
/* Ignore */
message TopologyCache {
  message Entry {
    uint64 poller_id = 1;
    uint64 relay_id  = 2;
  }
  repeated Entry entries = 1;
}
