syntax = "proto3";

import "common.proto";

package com.centreon.broker;

/* Ignore */
message Bbdo {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

/* io::bbdo, bbdo::de_welcome, 49 */
message Welcome {
  Bbdo version = 1;
  string extensions = 2;
  uint64 poller_id = 3;
  string poller_name = 4;
  /* Broker name is more relevant than poller name because for example on the
   * central, rrd broker, central broker and engine share the same poller name
   * that is 'Central'. */
  string broker_name = 5;
  com.centreon.common.PeerType peer_type = 6;
  bool extended_negotiation = 7;
  /* Engine configuration version sent by Engine so Broker is aware of it. */
  string engine_conf = 8;
  /* Local timezone of the poller machine (IANA name), sent by Engine so Broker
   * can evaluate notification/dependency timeperiods in the poller's timezone
   * when a host/service carries no explicit timezone. Empty for non-Engine
   * peers. */
  string timezone = 9;
  /* Sent by Broker to Engine at negotiation: true when Broker owns the
   * notification decision (notification_mode=broker). Engine then stops
   * deciding notifications on its own (notifier::notify becomes a no-op) and
   * only executes what Broker dispatches via pb_notification_execute. */
  bool broker_handles_notifications = 10;
}

/* io::bbdo, bbdo::de_pb_ack, 50 */
message Ack {
  uint32 acknowledged_events = 1;
}

/* io::bbdo, bbdo::de_pb_stop, 51 */
message Stop {
  uint64 poller_id = 1;
}

/* io::bbdo, bbdo::de_pb_diff_state_ack, 55 */
message DiffStateAck {
  uint64 poller_id = 1;
  string config_version = 2;
}

/* Sent by a relay Broker to its upstream Broker to request the Engine
 * configuration for the given poller. The config_version field carries the
 * version currently known by the relay (empty if none). */
/* io::bbdo, bbdo::de_pb_config_request, 58 */
message ConfigRequest {
  uint64 poller_id = 1;
  string poller_name = 2;
  string config_version = 3;
}

/* Sent by upstream Broker to a relay to inform it that the given poller is
 * no longer managed by the central and the relay should stop forwarding its
 * configuration. */
/* io::bbdo, bbdo::de_pb_config_revoke, 59 */
message ConfigRevoke {
  uint64 poller_id = 1;
}

// Broker-side notification model C (notification_mode=broker): Broker owns the
// notification DECISION (contact selection + escalations) and dispatches only
// the EXECUTION (macro expansion + notification command launch) to the poller
// that supervises the resource, through this one-way event. It is an io::bbdo
// event so the poller's cbmod_stream catches it in _handle_bbdo_event (like
// pb_diff_state) and hands it to the Engine event loop. Broker broadcasts it;
// each poller acts only on the resources it supervises and ignores the rest.
//
// The contacts field already holds the exact set Broker selected (per-contact
// filtering — enable flags, notification period, notify_on — is done on Broker),
// so the poller only expands macros and runs each contact's notification
// command. category/reason_type/options carry the integer values of the
// matching com::centreon::common::notifications enums (notification_category,
// reason_type, notification_option). service_id == 0 designates a host.
/* io::bbdo, bbdo::de_pb_notification_execute, 60 */
message NotificationExecute {
  uint64 host_id = 1;
  uint64 service_id = 2;
  uint32 category = 3;
  uint32 reason_type = 4;
  uint64 notification_id = 5;
  uint32 notification_number = 6;
  bool escalated = 7;
  string author = 8;
  string message = 9;
  uint32 options = 10;
  repeated string contacts = 11;
}

/* Written on disk (topology.cache) on clean central shutdown. Loaded on
 * restart as routing hints: engine peer N is reachable via relay R. */
/* Ignore */
message TopologyCache {
  message Entry {
    uint64 poller_id = 1;
    uint64 relay_id  = 2;
  }
  repeated Entry entries = 1;
}
